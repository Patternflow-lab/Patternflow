<!-- /audio-in, the panel's half: the frame around the editor. What only the
     panel has (the page's heading, the sources, the footer) and whatever
     closes the page. A source, not a page:
     firmware/toolchain/build_audio_in_page.py puts the editor's body
     (tools/patternflow-audio-extension/editor.html, between its EDITOR BODY
     lines) where the line that says only EDITOR is. The extension's own
     source bar does not come to the panel; this file is its counterpart.
     Edit it here, then run console_pages.py build. Comments and indentation
     do not travel.

     The frame is a console page (main.wrap, header, sections, footer), and
     also the editor's .page: the editor's body has no box of its own, its
     parts are laid out as this element's children.

     Sources is who can have the knobs. The microphone; and the browser
     extension and the phone app, which come in over the WebSocket (that row
     is in the page from the start and is hidden once the status says the
     build has no such path). The mapping the editor
     below holds is the panel's own: the microphone runs it, and so does the
     phone app, which has no mapping of its own (it reads this one and opens
     this page as its editor). Only the extension brings its own. Every word
     and switch in the list is drawn by _audio_in_adapter.js; the switches
     stay disabled until the panel has said how they stand. The microphone's
     note is inside its row, on a line of its own, so a fault reads under the
     switch it is about. -->
<main class="wrap page">
  <header><h1>Audio</h1><span class="sub" id="st"></span></header>
  <h2>Sources</h2>
  <ul class="list">
    <li>
      <button id="micToggle" class="toggleWrap" disabled>
        <span class="toggle"><span class="dotK"></span></span>
        <span class="toggleLabel">Microphone</span>
      </button>
      <span id="micChip" class="chip"></span>
      <span class="spacer"></span>
      <div class="damping">
        <label class="fieldLabel" for="micGain">Input gain</label>
        <input id="micGain" type="range" min="1" max="16" step="0.5" disabled>
        <span id="micGainVal" class="mono dimText"></span>
      </div>
      <p id="deviceNote" class="hint" style="flex-basis:100%"></p>
    </li>
    <li id="extRow">
      <button id="audToggle" class="toggleWrap" disabled>
        <span class="toggle"><span class="dotK"></span></span>
        <span class="toggleLabel">Browser extension and phone app</span>
      </button>
      <span id="extChip" class="chip"></span>
      <span class="hint">The extension brings its own mapping; the phone app uses the one below. Same switch as AUD on the panel’s NETWORK screen.
        <a href="https://github.com/engmung/Patternflow/tree/main/tools/patternflow-audio-extension#readme" target="_blank">Get the extension</a></span>
    </li>
  </ul>
  <h2>Mapping<span id="barMsg" class="msg" role="status"></span></h2>
  <p class="hint">For the microphone and the phone app. Changes save to the panel as you make them.</p>
  <!-- EDITOR -->
  <footer><a href="/">Console</a><a href="/status">Status</a></footer>
</main>
