<!doctype html>
<html lang="ko" data-theme="__THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  /*__VARS__*/
  --paper: #f6f2ef;
  --card: #ffffff;
  --ink: #1d1a1a;
  --soft: #6d6563;
  --line: #e4dcd8;
  --wall: linear-gradient(180deg, #efe8e4 0%, #e6dcd7 78%, #d5c9c3 78.2%, #cfc2bb 100%);
  --counter: #f9f6f4;
  --shade: rgba(40, 20, 20, 0.16);
}
:root[data-theme="dark"] {
  --paper: #121011;
  --card: #1b1819;
  --ink: #f3eeec;
  --soft: #a8a09d;
  --line: #2e2a2b;
  --wall: linear-gradient(180deg, #1f1b1c 0%, #171415 78%, #0c0b0b 78.2%, #0a0909 100%);
  --counter: #262223;
  --shade: rgba(0, 0, 0, 0.45);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
main { max-width: 1240px; margin: 0 auto; padding: 0 16px 64px; }
a { color: inherit; text-underline-offset: 3px; }
h1, h2, h3 { line-height: 1.25; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--soft); font-weight: 600; margin-bottom: 18px; }
section { padding: 44px 0; border-top: 1px solid var(--line); }

/* ── Head ── */
.head { padding: 52px 0 40px; display: grid; gap: 28px; grid-template-columns: 1.3fr 1fr; align-items: end; }
.kicker { font-size: 13px; letter-spacing: 0.14em; color: var(--soft); text-transform: uppercase; margin-bottom: 14px; }
.head h1 { font-size: clamp(34px, 5.4vw, 64px); letter-spacing: -0.03em; }
.head h1 .x { color: var(--accent); font-weight: 400; padding: 0 0.12em; }
.head .line { font-size: clamp(17px, 1.6vw, 21px); margin: 18px 0 0; max-width: 34em; }
.head .meta { color: var(--soft); font-size: 13px; margin-top: 14px; }
.hero { display: flex; gap: 12px; justify-content: flex-end; }
.hero .panel { width: min(150px, 28vw); }

/* ── Panels ── */
.panel { position: relative; aspect-ratio: 1 / 2; background: #060606 center / cover no-repeat; border-radius: 6px; box-shadow: 0 0 0 5px #0d0c0c, 0 14px 28px var(--shade); overflow: hidden; }
.panel canvas { display: block; width: 100%; height: 100%; }
.broken .panel::after { content: "패턴 오류"; position: absolute; inset: auto 0 0; padding: 6px; background: #b00020; color: #fff; font-size: 12px; text-align: center; }

/* ── Mood ── */
.mood { display: grid; grid-template-columns: 1.15fr 1fr; gap: 40px; }
.mood p { margin: 0 0 14px; max-width: 38em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.chips span { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; background: var(--card); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.swatch { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.swatch i { display: block; height: 74px; }
.swatch div { padding: 8px 10px 10px; font-size: 13px; line-height: 1.45; }
.swatch b { display: block; font-size: 14px; }
.swatch code { color: var(--soft); font-size: 12px; }
.swatch small { display: block; color: var(--soft); margin-top: 2px; }

/* ── Patterns ── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 22px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; grid-template-columns: 150px 1fr; gap: 18px; align-content: start; }
.tile h3 { font-size: 21px; }
.tile .note { margin: 6px 0 10px; font-weight: 600; }
.tile .why { margin: 0 0 12px; color: var(--soft); font-size: 15px; }
.knobs { display: grid; gap: 6px; margin: 0; }
.knobs label { display: grid; grid-template-columns: 74px 1fr 40px; align-items: center; gap: 8px; font-size: 13px; color: var(--soft); }
.knobs input { width: 100%; accent-color: var(--accent); }
.knobs output { font-variant-numeric: tabular-nums; text-align: right; }
.looks { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; margin-top: 4px; }
.looks figure { margin: 0; font-size: 12px; color: var(--soft); text-align: center; }
.looks .panel { box-shadow: 0 0 0 3px #0d0c0c; border-radius: 4px; margin-bottom: 6px; }
.looks b { display: block; color: var(--ink); font-size: 13px; }

/* ── Places ── */
.places { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 22px; }
.place { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.place figcaption { padding: 14px 18px 18px; }
.place figcaption b { display: block; font-size: 17px; margin-bottom: 4px; }
.place figcaption span { color: var(--soft); font-size: 15px; }
.scene { position: relative; height: 330px; background: var(--wall); overflow: hidden; }
.scene .panel { position: absolute; }
/* A wall of standing panels at the pop-up's entrance. */
.wall .panel { width: 17%; bottom: 25%; }
.wall .p1 { left: 18%; } .wall .p2 { left: 41.5%; } .wall .p3 { left: 65%; }
.wall::after { content: ""; position: absolute; left: 8%; right: 8%; bottom: 22%; height: 3%; background: var(--counter); box-shadow: 0 6px 14px var(--shade); }
/* One panel standing on a counter between testers. */
.counter .panel { width: 22%; left: 39%; bottom: 33%; }
.counter .top { position: absolute; left: 0; right: 0; bottom: 0; height: 33%; background: var(--counter); box-shadow: 0 -2px 0 var(--line); }
.counter .tester { position: absolute; bottom: 33%; width: 5%; border-radius: 4px 4px 2px 2px; background: var(--accent); opacity: 0.85; }
.counter .t1 { left: 14%; height: 15%; } .counter .t2 { left: 21%; height: 11%; background: var(--accent2); }
.counter .t3 { left: 70%; height: 13%; background: var(--accent2); } .counter .t4 { left: 77%; height: 17%; } .counter .t5 { left: 84%; height: 10%; opacity: 0.5; }
/* A vanity mirror with the panel as its side light. */
.mirror .glass { position: absolute; left: 14%; bottom: 22%; width: 40%; height: 66%; border-radius: 120px 120px 10px 10px; background: linear-gradient(160deg, rgba(255,255,255,0.75), rgba(200,210,220,0.35)); box-shadow: 0 0 0 6px var(--counter), 0 12px 24px var(--shade); }
:root[data-theme="dark"] .mirror .glass { background: linear-gradient(160deg, rgba(120,120,130,0.5), rgba(40,40,48,0.6)); }
.mirror .panel { width: 18%; left: 64%; bottom: 22%; }
.mirror::after { content: ""; position: absolute; left: 6%; right: 6%; bottom: 18%; height: 4%; background: var(--counter); box-shadow: 0 6px 14px var(--shade); }
/* A 9:16 phone frame: the pattern as the ground of a short video. */
.reel { display: grid; place-items: center; }
.reel .phone { position: relative; height: 88%; aspect-ratio: 9 / 16; border-radius: 26px; background: #050505; box-shadow: 0 0 0 7px #111, 0 16px 30px var(--shade); overflow: hidden; display: grid; place-items: center; }
.reel .phone .panel { position: relative; height: 100%; width: auto; border-radius: 0; box-shadow: none; }
.reel .phone::after { content: ""; position: absolute; top: 8px; left: 50%; width: 30%; height: 12px; transform: translateX(-50%); border-radius: 8px; background: #111; }
/* A shop window, four panels behind the glass. */
.window .frame { position: absolute; left: 12%; right: 12%; top: 9%; bottom: 20%; border: 8px solid var(--counter); background: #0b0a0a; box-shadow: 0 12px 24px var(--shade); display: flex; justify-content: center; align-items: center; gap: 4%; }
.window .frame .panel { position: relative; height: 84%; width: auto; box-shadow: 0 0 0 3px #1a1818; }
.window .frame::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 38%, rgba(255,255,255,0.08) 62%, rgba(255,255,255,0) 70%); pointer-events: none; }

/* ── Sources ── */
.sources ol { margin: 0; padding-left: 22px; columns: 2; column-gap: 40px; }
.sources li { break-inside: avoid; margin-bottom: 10px; font-size: 14px; }
.sources li span { display: block; color: var(--soft); }
footer { color: var(--soft); font-size: 13px; padding-top: 28px; border-top: 1px solid var(--line); }

@media (max-width: 820px) {
  .head, .mood { grid-template-columns: 1fr; }
  .hero { justify-content: flex-start; }
  .sources ol { columns: 1; }
}
@media (max-width: 520px) {
  .tiles, .places { grid-template-columns: 1fr; }
  .tile { grid-template-columns: 112px 1fr; padding: 14px; gap: 14px; }
  .knobs label { grid-template-columns: 58px 1fr 34px; }
  .scene { height: 280px; }
  section { padding: 34px 0; }
}
</style>
</head>
<body>
<main>
<!--__BODY__-->
</main>
<script type="application/json" id="sheet-data">/*__DATA__*/</script>
<script>/*__SCRIPT__*/</script>
</body>
</html>
