 \u003c x1; x++) {\n        if (mirror) {\n          display.setPixel(x, 31 - lv, c[0], c[1], c[2]);\n          display.setPixel(x, 32 + lv, c[0], c[1], c[2]);\n        } else {\n          display.setPixel(x, H - 1 - lv, c[0], c[1], c[2]);\n        }\n      }\n    }\n  }\n}\n","ramp":{"stops":[{"position":0,"color":"#000000","alpha":1},{"position":1,"color":"#ffffff","alpha":1}],"mode":"linear","wrap":false},"recolor":false,"knobsAnnotationRaw":"// @knobs Hue=0..1, Tempo=90..180, Bars=16..48, Decay=0..1","matrixAnnotationRaw":"// @matrix 128x64"},"matrix":{"width":128,"height":64},"knobs":[{"name":"Hue","min":0,"max":1,"about":"Where the colour starts at the bass end; it climbs a third of the wheel to the treble end."},{"name":"Tempo","min":90,"max":180,"about":"Beats per minute of the drum machine, with sixteenth-note hats."},{"name":"Bars","min":16,"max":48,"about":"How many bands the meter splits into, from sixteen fat ones to a fine comb."},{"name":"Decay","min":0,"max":1,"about":"How long each hit rings; low is tight and punchy, high swells and hangs."}],"start":[0,90,16,0.06],"measures":{"motion":0.7879,"detail":0.0812,"edges":0.9998,"complexity":0.1587,"coverage":0.2056,"colour":0.2277,"drift":0.1238},"knobResponse":[0.0809,0.0655,0.0712,0.0699]},{"slug":"rule-scroll","title":"Rule Scroll","family":"automata","note":"","idea":"A row of 128 cells looks at its neighbours and writes the next row under itself, and one eight-bit number decides whether the rows grow into nested triangles or into noise.","buttons":"K1 tap starts again from a single cell.","code":"// ===== Patternflow pattern =====\n// Title:   Rule Scroll\n// Family:  automata\n// Idea:    A row of 128 cells looks at its neighbours and writes the next row under itself, and one eight-bit number decides whether the rows grow into nested triangles or into noise.\n// Author:  patternflow-lab\n// Date:    2026-10-22\n// SPDX-License-Identifier: CC-BY-SA-4.0\n// Lineage: original, pattern study 2026-10\n// ===============================\n// @matrix 128x64\n// @knobs Hue=0..1, Speed=0..4, Rule=0..11, Noise=0..1\n//\n// Knob 1: Hue. Turns the colours around the colour wheel; each colour stands for the three cells a cell was born from.\n// Knob 2: Speed. Generations per second, from 3 to 24, one row each.\n// Knob 3: Rule. Walks the rules 30, 45, 73, 90, 105, 110, 150, 182, 54, 18, 62 and 126.\n// Knob 4: Noise. Random flips each generation, which show as white sparks and break ordered rules open.\n// Buttons: K1 tap starts again from a single cell.\n\nfunction hsv(h, s, v) {\n  h = h - Math.floor(h);\n  const i = Math.floor(h * 6);\n  const f = h * 6 - i;\n  const p = v * (1 - s);\n  const q = v * (1 - f * s);\n  const t = v * (1 - (1 - f) * s);\n  const k = i % 6;\n  const r = k === 0 ? v : k === 1 ? q : k === 2 ? p : k === 3 ? p : k === 4 ? t : v;\n  const g = k === 0 ? t : k === 1 ? v : k === 2 ? v : k === 3 ? q : k === 4 ? p : p;\n  const b = k === 0 ? p : k === 1 ? p : k === 2 ? t : k === 3 ? v : k === 4 ? v : q;\n  return [r * 255, g * 255, b * 255];\n}\n\nconst W = 128;\nconst H = 64;\nconst RULES = [30, 45, 73, 90, 105, 110, 150, 182, 54, 18, 62, 126];\n// Hue offset, saturation and brightness for each neighbourhood, left centre\n// right as three bits, then one more for a cell the noise flipped. The two\n// uniform ones, 000 and 111, are a rule's ground and stay dim, so the\n// structure carries the light.\nconst LOOK = [\n  [0.5, 0.85, 0.3],\n  [-0.06, 0.9, 1.0],\n  [0.0, 0.9, 0.75],\n  [-0.03, 0.85, 0.85],\n  [0.06, 0.9, 1.0],\n  [0.5, 0.75, 1.0],\n  [0.03, 0.85, 0.85],\n  [0.0, 0.7, 0.35],\n  [0.0, 0.0, 1.0],\n];\n\nfunction rand(params) {\n  let s = params.rng | 0;\n  s ^= s \u003c\u003c 13;\n  s ^= s >>> 17;\n  s ^= s \u003c\u003c 5;\n  params.rng = s;\n  return (s >>> 0) / 4294967296;\n}\n\nexport function setup(params) {\n  params.rows = new Uint8Array(W * H);\n  params.cur = new Uint8Array(W);\n  params.nxt = new Uint8Array(W);\n  params.back = new Uint8Array(W);\n  params.palette = new Float32Array(LOOK.length * 3);\n  params.rng = (Math.random() * 4294967295) | 1;\n  params.head = 0;\n  params.acc = 0;\n  params.gen = 0;\n  params.repeats = 0;\n  params.started = false;\n}\n\nfunction restart(params, rule) {\n  params.cur.fill(0);\n  params.cur[W >> 1] = 1;\n  params.rows.fill(0);\n  // Fill the panel before the first frame, so it opens on the whole cone.\n  for (let i = 0; i \u003c H - 1; i++) step(params, rule, 0);\n}\n\nfunction step(params, rule, noise) {\n  const cur = params.cur;\n  const nxt = params.nxt;\n  params.head = (params.head + 1) % H;\n  const row = params.head * W;\n  let lit = 0;\n  for (let x = 0; x \u003c W; x++) {\n    const n = (cur[(x + W - 1) % W] \u003c\u003c 2) | (cur[x] \u003c\u003c 1) | cur[(x + 1) % W];\n    const v = (rule >> n) & 1;\n    nxt[x] = v;\n    params.rows[row + x] = v ? 1 + n : 0;\n    lit += v;\n  }\n  // Noise is the mean number of flips per generation; the fraction is a chance.\n  let flips = Math.floor(noise);\n  if (rand(params) \u003c noise - flips) flips++;\n  for (let f = 0; f \u003c flips; f++) {\n    const x = Math.floor(rand(params) * W);\n    nxt[x] ^= 1;\n    lit += nxt[x] ? 1 : -1;\n    params.rows[row + x] = nxt[x] ? 9 : 0;\n  }\n  // A row that is all one state, or repeats the one two generations back,\n  // has nothing left to show: one flipped cell starts it moving again.\n  let same = true;\n  for (let x = 0; x \u003c W && same; x++) if (nxt[x] !== params.back[x]) same = false;\n  params.repeats = same ? params.repeats + 1 : 0;\n  if (lit === 0 || lit === W || params.repeats > 24) {\n    const x = Math.floor(rand(params) * W);\n    nxt[x] ^= 1;\n    params.rows[row + x] = nxt[x] ? 9 : 0;\n    params.repeats = 0;\n  }\n  params.back.set(cur);\n  params.cur = nxt;\n  params.nxt = cur;\n  params.gen++;\n}\n\nexport function update(dt, input, params) {\n  const k = input.knobValues || [0, 2, 0, 0.06];\n  // K1 at 0 opens on green rather than the red most of the study opens on.\n  params.hue = k[0] + 0.3;\n  const rate = 3 * Math.pow(2, 0.75 * k[1]);\n  const rule = RULES[Math.max(0, Math.min(RULES.length - 1, Math.round(k[2])))];\n  const noise = 5 * k[3] * k[3];\n  if (!params.started || (input.btnPressed && input.btnPressed[0])) {\n    restart(params, rule);\n    params.started = true;\n  }\n  params.acc += dt * rate;\n  let steps = 0;\n  while (params.acc >= 1 && steps \u003c 4) {\n    step(params, rule, noise);\n    params.acc -= 1;\n    steps++;\n  }\n  if (params.acc > 1) params.acc = 1;\n  // The colours drift slowly with the generations, one turn in about 2500.\n  const drift = params.gen * 0.0004;\n  for (let i = 0; i \u003c LOOK.length; i++) {\n    const c = hsv(params.hue + drift + LOOK[i][0], LOOK[i][1], LOOK[i][2]);\n    params.palette[i * 3] = c[0];\n    params.palette[i * 3 + 1] = c[1];\n    params.palette[i * 3 + 2] = c[2];\n  }\n}\n\nexport function draw(display, params, time) {\n  const pal = params.palette;\n  for (let y = 0; y \u003c H; y++) {\n    // The newest row is at the bottom; older rows dim a little as they rise.\n    const ring = (params.head - (H - 1 - y) + H * 2) % H;\n    const fade = 0.55 + 0.45 * (y / (H - 1));\n    const row = ring * W;\n    for (let x = 0; x \u003c W; x++) {\n      const v = params.rows[row + x];\n      if (v === 0) {\n        display.setPixel(x, y, 0, 0, 0);\n        continue;\n      }\n      const c = (v - 1) * 3;\n      display.setPixel(x, y, pal[c] * fade, pal[c + 1] * fade, pal[c + 2] * fade);\n    }\n  }\n}\n","layer":{"id":"layer-rule-scroll","type":"code","name":"rule-scroll","visible":true,"opacity":1,"blend":"normal","role":"paint","maskInvert":false,"code":"// ===== Patternflow pattern =====\n// Title:   Rule Scroll\n// Family:  automata\n// Idea:    A row of 128 cells looks at its neighbours and writes the next row under itself, and one eight-bit number decides whether the rows grow into nested triangles or into noise.\n// Author:  patternflow-lab\n// Date:    2026-10-22\n// SPDX-License-Identifier: CC-BY-SA-4.0\n// Lineage: original, pattern study 2026-10\n// ===============================\n// @matrix 128x64\n// @knobs Hue=0..1, Speed=0..4, Rule=0..11, Noise=0..1\n//\n// Knob 1: Hue. Turns the colours around the colour wheel; each colour stands for the three cells a cell was born from.\n// Knob 2: Speed. Generations per second, from 3 to 24, one row each.\n// Knob 3: Rule. Walks the rules 30, 45, 73, 90, 105, 110, 150, 182, 54, 18, 62 and 126.\n// Knob 4: Noise. Random flips each generation, which show as white sparks and break ordered rules open.\n// Buttons: K1 tap starts again from a single cell.\n\nfunction hsv(h, s, v) {\n  h = h - Math.floor(h);\n  const i = Math.floor(h * 6);\n  const f = h * 6 - i;\n  const p = v * (1 - s);\n  const q = v * (1 - f * s);\n  const t = v * (1 - (1 - f) * s);\n  const k = i % 6;\n  const r = k === 0 ? v : k === 1 ? q : k === 2 ? p : k === 3 ? p : k === 4 ? t : v;\n  const g = k === 0 ? t : k === 1 ? v : k === 2 ? v : k === 3 ? q : k === 4 ? p : p;\n  const b = k === 0 ? p : k === 1 ? p : k === 2 ? t : k === 3 ? v : k === 4 ? v : q;\n  return [r * 255, g * 255, b * 255];\n}\n\nconst W = 128;\nconst H = 64;\nconst RULES = [30, 45, 73, 90, 105, 110, 150, 182, 54, 18, 62, 126];\n// Hue offset, saturation and brightness for each neighbourhood, left centre\n// right as three bits, then one more for a cell the noise flipped. The two\n// uniform ones, 000 and 111, are a rule's ground and stay dim, so the\n// structure carries the light.\nconst LOOK = [\n  [0.5, 0.85, 0.3],\n  [-0.06, 0.9, 1.0],\n  [0.0, 0.9, 0.75],\n  [-0.03, 0.85, 0.85],\n  [0.06, 0.9, 1.0],\n  [0.5, 0.75, 1.0],\n  [0.03, 0.85, 0.85],\n  [0.0, 0.7, 0.35],\n  [0.0, 0.0, 1.0],\n];\n\nfunction rand(params) {\n  let s = params.rng | 0;\n  s ^= s \u003c\u003c 13;\n  s ^= s >>> 17;\n  s ^= s \u003c\u003c 5;\n  params.rng = s;\n  return (s >>> 0) / 4294967296;\n}\n\nexport function setup(params) {\n  params.rows = new Uint8Array(W * H);\n  params.cur = new Uint8Array(W);\n  params.nxt = new Uint8Array(W);\n  params.back = new Uint8Array(W);\n  params.palette = new Float32Array(LOOK.length * 3);\n  params.rng = (Math.random() * 4294967295) | 1;\n  params.head = 0;\n  params.acc = 0;\n  params.gen = 0;\n  params.repeats = 0;\n  params.started = false;\n}\n\nfunction restart(params, rule) {\n  params.cur.fill(0);\n  params.cur[W >> 1] = 1;\n  params.rows.fill(0);\n  // Fill the panel before the first frame, so it opens on the whole cone.\n  for (let i = 0; i \u003c H - 1; i++) step(params, rule, 0);\n}\n\nfunction step(params, rule, noise) {\n  const cur = params.cur;\n  const nxt = params.nxt;\n  params.head = (params.head + 1) % H;\n  const row = params.head * W;\n  let lit = 0;\n  for (let x = 0; x \u003c W; x++) {\n    const n = (cur[(x + W - 1) % W] \u003c\u003c 2) | (cur[x] \u003c\u003c 1) | cur[(x + 1) % W];\n    const v = (rule >> n) & 1;\n    nxt[x] = v;\n    params.rows[row + x] = v ? 1 + n : 0;\n    lit += v;\n  }\n  // Noise is the mean number of flips per generation; the fraction is a chance.\n  let flips = Math.floor(noise);\n  if (rand(params) \u003c noise - flips) flips++;\n  for (let f = 0; f \u003c flips; f++) {\n    const x = Math.floor(rand(params) * W);\n    nxt[x] ^= 1;\n    lit += nxt[x] ? 1 : -1;\n    params.rows[row + x] = nxt[x] ? 9 : 0;\n  }\n  // A row that is all one state, or repeats the one two generations back,\n  // has nothing left to show: one flipped cell starts it moving again.\n  let same = true;\n  for (let x = 0; x \u003c W && same; x++) if (nxt[x] !== params.back[x]) same = false;\n  params.repeats = same ? params.repeats + 1 : 0;\n  if (lit === 0 || lit === W || params.repeats > 24) {\n    const x = Math.floor(rand(params) * W);\n    nxt[x] ^= 1;\n    params.rows[row + x] = nxt[x] ? 9 : 0;\n    params.repeats = 0;\n  }\n  params.back.set(cur);\n  params.cur = nxt;\n  params.nxt = cur;\n  params.gen++;\n}\n\nexport function update(dt, input, params) {\n  const k = input.knobValues || [0, 2, 0, 0.06];\n  // K1 at 0 opens on green rather than the red most of the study opens on.\n  params.hue = k[0] + 0.3;\n  const rate = 3 * Math.pow(2, 0.75 * k[1]);\n  const rule = RULES[Math.max(0, Math.min(RULES.length - 1, Math.round(k[2])))];\n  const noise = 5 * k[3] * k[3];\n  if (!params.started || (input.btnPressed && input.btnPressed[0])) {\n    restart(params, rule);\n    params.started = true;\n  }\n  params.acc += dt * rate;\n  let steps = 0;\n  while (params.acc >= 1 && steps \u003c 4) {\n    step(params, rule, noise);\n    params.acc -= 1;\n    steps++;\n  }\n  if (params.acc > 1) params.acc = 1;\n  // The colours drift slowly with the generations, one turn in about 2500.\n  const drift = params.gen * 0.0004;\n  for (let i = 0; i \u003c LOOK.length; i++) {\n    const c = hsv(params.hue + drift + LOOK[i][0], LOOK[i][1], LOOK[i][2]);\n    params.palette[i * 3] = c[0];\n    params.palette[i * 3 + 1] = c[1];\n    params.palette[i * 3 + 2] = c[2];\n  }\n}\n\nexport function draw(display, params, time) {\n  const pal = params.palette;\n  for (let y = 0; y \u003c H; y++) {\n    // The newest row is at the bottom; older rows dim a little as they rise.\n    const ring = (params.head - (H - 1 - y) + H * 2) % H;\n    const fade = 0.55 + 0.45 * (y / (H - 1));\n    const row = ring * W;\n    for (let x = 0; x \u003c W; x++) {\n      const v = params.rows[row + x];\n      if (v === 0) {\n        display.setPixel(x, y, 0, 0, 0);\n        continue;\n      }\n      const c = (v - 1) * 3;\n      display.setPixel(x, y, pal[c] * fade, pal[c + 1] * fade, pal[c + 2] * fade);\n    }\n  }\n}\n","ramp":{"stops":[{"position":0,"color":"#000000","alpha":1},{"position":1,"color":"#ffffff","alpha":1}],"mode":"linear","wrap":false},"recolor":false,"knobsAnnotationRaw":"// @knobs Hue=0..1, Speed=0..4, Rule=0..11, Noise=0..1","matrixAnnotationRaw":"// @matrix 128x64"},"matrix":{"width":128,"height":64},"knobs":[{"name":"Hue","min":0,"max":1,"about":"Turns the colours around the colour wheel; each colour stands for the three cells a cell was born from."},{"name":"Speed","min":0,"max":4,"about":"Generations per second, from 3 to 24, one row each."},{"name":"Rule","min":0,"max":11,"about":"Walks the rules 30, 45, 73, 90, 105, 110, 150, 182, 54, 18, 62 and 126."},{"name":"Noise","min":0,"max":1,"about":"Random flips each generation, which show as white sparks and break ordered rules open."}],"start":[0,2,0,0.06],"measures":{"motion":3.1567,"detail":0.3554,"edges":0.7992,"complexity":0.4734,"coverage":0.4603,"colour":0.4227,"drift":0.104},"knobResponse":[0.2154,0.1903,0.1864,0.0655]},{"slug":"sparks","title":"Sparks","family":"particle","note":"","idea":"Each spark's colour is a clock counting down from white heat, so a whole shell shows its own age at a glance.","buttons":"K1 tap fires a shell straight away.","code":"// ===== Patternflow pattern =====\n// Title:   Sparks\n// Family:  particle\n// Idea:    Each spark's colour is a clock counting down from white heat, so a whole shell shows its own age at a glance.\n// Author:  patternflow-lab\n// Date:    2026-10-22\n// SPDX-License-Identifier: CC-BY-SA-4.0\n// Lineage: original, pattern study 2026-10\n// ===============================\n// @matrix 128x64\n// @knobs Spread=0..1, Rate=0.6..5, Gravity=-1..1, Trail=0.3..1.8\n//\n// Knob 1: Spread. At 0 every shell is the same colour, slowly turning over the minutes; higher spreads the shells round the wheel, and past halfway each shell carries a second colour.\n// Knob 2: Rate. How often a rocket goes up; the beat stays loose, with doubles and the odd rest.\n// Knob 3: Gravity. At 0 the sparks hang where the drag stops them; above 0 they droop like willows, below 0 they rise like embers.\n// Knob 4: Trail. Seconds a spark's streak takes to fade.\n// Buttons: K1 tap fires a shell straight away.\n\nconst W = 128;\nconst H = 64;\nconst P = 900;\nconst R = 8;\n\nfunction hsvInto(out, h, s, v) {\n  h = h - Math.floor(h);\n  const i = Math.floor(h * 6);\n  const f = h * 6 - i;\n  const p = v * (1 - s);\n  const q = v * (1 - f * s);\n  const t = v * (1 - (1 - f) * s);\n  const k = i % 6;\n  out[0] = (k === 0 ? v : k === 1 ? q : k === 2 ? p : k === 3 ? p : k === 4 ? t : v) * 255;\n  out[1] = (k === 0 ? t : k === 1 ? v : k === 2 ? v : k === 3 ? q : k === 4 ? p : p) * 255;\n  out[2] = (k === 0 ? p : k === 1 ? p : k === 2 ? t : k === 3 ? v : k === 4 ? v : q) * 255;\n}\n\n// A cheap repeatable 0..1 from two integers, for the glitter.\nfunction hash(a, b) {\n  let h = Math.imul(a, 374761393) ^ Math.imul(b, 668265263);\n  h = Math.imul(h ^ (h >>> 13), 1274126177);\n  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;\n}\n\nfunction splat(buf, x, y, c) {\n  const x0 = Math.ceil(x - 1.2);\n  const y0 = Math.ceil(y - 1.2);\n  for (let yy = y0; yy \u003c= y0 + 2; yy++) {\n    if (yy \u003c 0 || yy >= H) continue;\n    const dy = yy - y;\n    for (let xx = x0; xx \u003c= x0 + 2; xx++) {\n      if (xx \u003c 0 || xx >= W) continue;\n      const dx = xx - x;\n      const w = 1 - (dx * dx + dy * dy) / 1.44;\n      if (w \u003c= 0) continue;\n      const i = (yy * W + xx) * 3;\n      // The brighter spark takes the LED whole, so a fading white flash never greys a coloured one.\n      if ((c[0] + c[1] + c[2]) * w > buf[i] + buf[i + 1] + buf[i + 2]) {\n        buf[i] = c[0] * w;\n        buf[i + 1] = c[1] * w;\n        buf[i + 2] = c[2] * w;\n      }\n    }\n  }\n}\n\nfunction line(buf, x0, y0, x1, y1, c) {\n  const dx = x1 - x0;\n  const dy = y1 - y0;\n  const m = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 0.6));\n  for (let j = 1; j \u003c= m; j++) splat(buf, x0 + (dx * j) / m, y0 + (dy * j) / m, c);\n}\n\nexport function setup(params) {\n  params.x = new Float32Array(P);\n  params.y = new Float32Array(P);\n  params.vx = new Float32Array(P);\n  params.vy = new Float32Array(P);\n  params.age = new Float32Array(P);\n  params.life = new Float32Array(P);\n  params.hue = new Float32Array(P);\n  params.drag = new Float32Array(P);\n  params.glitter = new Uint8Array(P);\n  params.next = 0;\n  // Rockets on their way up: launch x, target, time in flight, flight time, last position.\n  params.rx = new Float32Array(R);\n  params.rtx = new Float32Array(R);\n  params.rty = new Float32Array(R);\n  params.rt = new Float32Array(R);\n  params.rf = new Float32Array(R);\n  params.rpx = new Float32Array(R);\n  params.rpy = new Float32Array(R);\n  params.rOn = new Uint8Array(R);\n  params.buf = new Float32Array(W * H * 3);\n  params.col = new Float32Array(3);\n  params.t = 0;\n  params.beat = 0.15;\n  params.spread = 0;\n  params.gravity = 0;\n}\n\nfunction emit(params, x, y, vx, vy, life, hue, drag, glitter) {\n  const i = params.next;\n  params.next = (i + 1) % P;\n  params.x[i] = x;\n  params.y[i] = y;\n  params.vx[i] = vx;\n  params.vy[i] = vy;\n  params.age[i] = 0;\n  params.life[i] = life;\n  params.hue[i] = hue;\n  params.drag[i] = drag;\n  params.glitter[i] = glitter;\n}\n\nfunction launch(params, late) {\n  let r = 0;\n  while (r \u003c R && params.rOn[r]) r++;\n  if (r === R) return;\n  // Shells that will fall burst high, shells that will rise burst low.\n  const top = 12 + Math.max(0, -params.gravity) * 18;\n  params.rtx[r] = 18 + Math.random() * 92;\n  params.rty[r] = top + Math.random() * 20;\n  params.rx[r] = params.rtx[r] + (Math.random() - 0.5) * 12;\n  params.rt[r] = 0;\n  params.rf[r] = 0.45 + Math.random() * 0.3 + late;\n  params.rpx[r] = params.rx[r];\n  params.rpy[r] = H + 1;\n  params.rOn[r] = 1;\n}\n\nfunction burst(params, x, y) {\n  const spread = params.spread;\n  // At spread 0 one colour drifts round the wheel over three minutes.\n  const base = 0.08 + params.t * 0.0055;\n  const hue = base + (Math.random() - 0.5) * spread;\n  // Past halfway a shell carries a second colour as well.\n  const second = hue + 0.22 + Math.random() * 0.2;\n  const mix = Math.max(0, spread - 0.4) * 0.8;\n  const kind = Math.random();\n  const size = 0.6 + Math.random() * 0.5;\n  const glitter = Math.random() \u003c 0.5 ? 1 : 0;\n  if (kind \u003c 0.22) {\n    // Ring: one even hoop, tipped so it reads as seen at an angle.\n    const n = 52;\n    const tilt = 0.4 + Math.random() * 0.6;\n    const r0 = Math.random() * Math.PI * 2;\n    const v = 78 * size;\n    for (let i = 0; i \u003c n; i++) {\n      const a = r0 + (i / n) * Math.PI * 2;\n      const h = Math.random() \u003c mix ? second : hue;\n      emit(params, x, y, Math.cos(a) * v, Math.sin(a) * v * tilt, 1.4 + Math.random() * 0.3, h, 2.8, glitter);\n    }\n  } else if (kind \u003c 0.4) {\n    // Willow: slower sparks that live long and hang.\n    const n = 64;\n    for (let i = 0; i \u003c n; i++) {\n      const a = Math.random() * Math.PI * 2;\n      const c = Math.random() * 2 - 1;\n      const v = 60 * size * Math.sqrt(1 - c * c) * (0.9 + 0.1 * Math.random());\n      const h = Math.random() \u003c mix ? second : hue;\n      emit(params, x, y, Math.cos(a) * v, Math.sin(a) * v, 2.6 + Math.random() * 0.8, h, 2.4, 1);\n    }\n  } else {\n    // Peony: a sphere of sparks seen flat, so they crowd towards its rim.\n    const n = 80 + Math.floor(Math.random() * 24);\n    for (let i = 0; i \u003c n; i++) {\n      const a = Math.random() * Math.PI * 2;\n      const c = Math.random() * 2 - 1;\n      const v = 82 * size * Math.sqrt(1 - c * c) * (0.9 + 0.1 * Math.random());\n      const h = Math.random() \u003c mix ? second : hue;\n      emit(params, x, y, Math.cos(a) * v, Math.sin(a) * v, 1.3 + Math.random() * 0.6, h, 2.8, glitter);\n    }\n  }\n}\n\nexport function update(dt, input, params) {\n  const k = input.knobValues || [0, 2, 0, 0.3];\n  params.spread = Math.max(0, Math.min(1, k[0]));\n  const rate = 0.25 + k[1] * 0.5;\n  params.gravity = Math.max(-1, Math.min(1, k[2]));\n  const trail = Math.max(0.05, k[3]);\n  dt = Math.min(dt, 0.1);\n  params.t += dt;\n\n  // The beat: mostly one rocket a beat, sometimes a quick second, now and then a rest.\n  params.beat -= dt;\n  if (params.beat \u003c= 0) {\n    const r = Math.random();\n    if (r \u003c 0.1 && rate > 0.8) {\n      params.beat = 0.6 / rate;\n    } else {\n      launch(params, 0);\n      if (r > 0.8) launch(params, 0.12 + Math.random() * 0.18);\n      params.beat = (0.75 + Math.random() * 0.5) / rate;\n    }\n  }\n  if (input.btnPressed && input.btnPressed[0]) burst(params, 20 + Math.random() * 88, 16 + Math.random() * 26);\n\n  const buf = params.buf;\n  const fade = Math.exp(-dt / trail);\n  for (let i = 0; i \u003c buf.length; i++) buf[i] *= fade;\n\n  const col = params.col;\n  hsvInto(col, 0.09, 0.5, 0.5);\n  for (let r = 0; r \u003c R; r++) {\n    if (!params.rOn[r]) continue;\n    params.rt[r] += dt;\n    const u = Math.min(1, params.rt[r] / params.rf[r]);\n    // Eases out as it climbs, the way a rocket slows near the top.\n    const e = 1 - (1 - u) * (1 - u);\n    const nx = params.rx[r] + (params.rtx[r] - params.rx[r]) * e;\n    const ny = H + 1 + (params.rty[r] - H - 1) * e;\n    line(buf, params.rpx[r], params.rpy[r], nx, ny, col);\n    params.rpx[r] = nx;\n    params.rpy[r] = ny;\n    if (u >= 1) {\n      params.rOn[r] = 0;\n      burst(params, nx, ny);\n    }\n  }\n\n  const g = params.gravity * 44;\n  const tick = Math.floor(params.t * 24);\n  const { x, y, vx, vy, age, life, hue, drag, glitter } = params;\n  for (let i = 0; i \u003c P; i++) {\n    if (age[i] >= life[i]) continue;\n    age[i] += dt;\n    const ox = x[i];\n    const oy = y[i];\n    const f = Math.exp(-drag[i] * dt);\n    vx[i] *= f;\n    vy[i] = vy[i] * f + g * dt;\n    x[i] += vx[i] * dt;\n    y[i] += vy[i] * dt;\n    if (age[i] >= life[i]) continue;\n    const T = 1 - age[i] / life[i];\n    // White for the first frames, in the shell's full colour a seventh of a second later.\n    let s = 0.95 * Math.min(1, (age[i] + 0.01) / 0.14);\n    let v = Math.min(1, T * 1.8);\n    if (glitter[i] && T \u003c 0.5) {\n      const h = hash(i, tick);\n      if (h \u003c 0.12) {\n        s *= 0.5;\n        v = 1;\n }\n  if (input.btnPressed && input.btnPressed[0]) burst(params, 20 + Math.random() * 88, 16 + Math.random() * 26);\n\n  const buf = params.buf;\n  const fade = Math.exp(-dt / trail);\n  for (let i = 0; i \u003c buf.length; i++) buf[i] *= fade;\n\n  const col = params.col;\n  hsvInto(col, 0.09, 0.5, 0.5);\n  for (let r = 0; r \u003c R; r++) {\n    if (!params.rOn[r]) continue;\n    params.rt[r] += dt;\n    const u = Math.min(1, params.rt[r] / params.rf[r]);\n    // Eases out as it climbs, the way a rocket slows near the top.\n    const e = 1 - (1 - u) * (1 - u);\n    const nx = params.rx[r] + (params.rtx[r] - params.rx[r]) * e;\n    const ny = H + 1 + (params.rty[r] - H - 1) * e;\n    line(buf, params.rpx[r], params.rpy[r], nx, ny, col);\n    params.rpx[r] = nx;\n    params.rpy[r] = ny;\n    if (u >= 1) {\n      params.rOn[r] = 0;\n      burst(params, nx, ny);\n    }\n  }\n\n  const g = params.gravity * 44;\n  const tick = Math.floor(params.t * 24);\n  const { x, y, vx, vy, age, life, hue, drag, glitter } = params;\n  for (let i = 0; i \u003c P; i++) {\n    if (age[i] >= life[i]) continue;\n    age[i] += dt;\n    const ox = x[i];\n    const oy = y[i];\n    const f = Math.exp(-drag[i] * dt);\n    vx[i] *= f;\n    vy[i] = vy[i] * f + g * dt;\n    x[i] += vx[i] * dt;\n    y[i] += vy[i] * dt;\n    if (age[i] >= life[i]) continue;\n    const T = 1 - age[i] / life[i];\n    // White for the first frames, in the shell's full colour a seventh of a second later.\n    let s = 0.95 * Math.min(1, (age[i] + 0.01) / 0.14);\n    let v = Math.min(1, T * 1.8);\n    if (glitter[i] && T \u003c 0.5) {\n      const h = hash(i, tick);\n      if (h \u003c 0.12) {\n        s *= 0.5;\n        v = 1;\n      } else v *= h \u003c 0.55 ? 0.3 : 0.8;\n    }\n    if (v \u003c 0.04) continue;\n    hsvInto(col, hue[i] - (1 - T) * 0.04, s, v);\n    line(buf, ox, oy, x[i], y[i], col);\n  }\n}\n\nexport function draw(display, params, time) {\n  const buf = params.buf;\n  for (let y = 0; y \u003c H; y++) {\n    for (let x = 0; x \u003c W; x++) {\n      const i = (y * W + x) * 3;\n      display.setPixel(x, y, buf[i], buf[i + 1], buf[i + 2]);\n    }\n  }\n}\n","ramp":{"stops":[{"position":0,"color":"#000000","alpha":1},{"position":1,"color":"#ffffff","alpha":1}],"mode":"linear","wrap":false},"recolor":false,"knobsAnnotationRaw":"// @knobs Spread=0..1, Rate=0.6..5, Gravity=-1..1, Trail=0.3..1.8","matrixAnnotationRaw":"// @matrix 128x64"},"matrix":{"width":128,"height":64},"knobs":[{"name":"Spread","min":0,"max":1,"about":"At 0 every shell is the same colour, slowly turning over the minutes; higher spreads the shells round the wheel, and past halfway each shell carries a second colour."},{"name":"Rate","min":0.6,"max":5,"about":"How often a rocket goes up; the beat stays loose, with doubles and the odd rest."},{"name":"Gravity","min":-1,"max":1,"about":"At 0 the sparks hang where the drag stops them; above 0 they droop like willows, below 0 they rise like embers."},{"name":"Trail","min":0.3,"max":1.8,"about":"Seconds a spark's streak takes to fade."}],"start":[0,2,0,0.3],"measures":{"motion":0.3325,"detail":0.0396,"edges":0.4097,"complexity":0.7464,"coverage":0.1608,"colour":0.1435,"drift":0.1345},"knobResponse":[0.0363,0.0899,0.0534,0.0676]},{"slug":"test-card","title":"Test Card","family":"glitch","note":"","idea":"A television's colour bars, as a set that is losing its hold would show them.","buttons":"K1 tap tears the picture now.","code":"// ===== Patternflow pattern =====\n// Title:   Test Card\n// Family:  glitch\n// Idea:    A television's colour bars, as a set that is losing its hold would show them.\n// Author:  patternflow-lab\n// Date:    2026-10-22\n// SPDX-License-Identifier: CC-BY-SA-4.0\n// Lineage: original, pattern study 2026-10\n// ===============================\n// @matrix 128x64\n// @knobs Hue=0..1, Bursts=0.2..6, Damage=0.15..1, Roll=0..1\n//\n// Knob 1: Hue. Turns the whole set of bars round the colour wheel.\n// Knob 2: Bursts. How often the picture tears.\n// Knob 3: Damage. From a clean card with the odd twitch to bars torn apart and smeared.\n// Knob 4: Roll. The vertical hold: the picture starts to slip and roll.\n// Buttons: K1 tap tears the picture now.\n\nconst BARS = [\n  [235, 235, 235],\n  [235, 235, 16],\n  [16, 235, 235],\n  [16, 235, 16],\n  [235, 16, 235],\n  [235, 16, 16],\n  [16, 16, 235],\n];\n\nfunction hash(a, b) {\n  const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453;\n  return s - Math.floor(s);\n}\n\nfunction turn(c, hue) {\n  // Rotate an RGB colour round the grey axis.\n  const a = hue * Math.PI * 2;\n  const cos = Math.cos(a);\n  const sin = Math.sin(a);\n  const k = (1 - cos) / 3;\n  const s3 = Math.sqrt(1 / 3) * sin;\n  const r = c[0] * (cos + k) + c[1] * (k - s3) + c[2] * (k + s3);\n  const g = c[0] * (k + s3) + c[1] * (cos + k) + c[2] * (k - s3);\n  const b = c[0] * (k - s3) + c[1] * (k + s3) + c[2] * (cos + k);\n  return [r, g, b];\n}\n\nexport function setup(params) {\n  params.t = 0;\n  params.tear = 0;\n  params.slot = -1;\n  params.seed = 0;\n  params.roll = 0;\n  params.palette = BARS.map((c) => c.slice());\n}\n\nexport function update(dt, input, params) {\n  const k = input.knobValues || [0, 2, 0.15, 0.06];\n  params.damage = k[2];\n  params.rollAmount = k[3];\n  params.t += dt;\n  const slot = Math.floor(params.t * k[1]);\n  if (slot !== params.slot) {\n    params.slot = slot;\n    if (hash(slot, 3.1) \u003c 0.7) {\n      params.tear = 0.25 + hash(slot, 7.7) * 0.5;\n      params.seed = slot;\n    }\n  }\n  if (input.btnPressed && input.btnPressed[0]) {\n    params.tear = 0.9;\n    params.seed = params.slot + 1000 + Math.floor(params.t * 10);\n  }\n  params.tear = Math.max(0, params.tear - dt * 1.1);\n  // The roll eases up to speed and back, like a hold that drifts.\n  params.roll += dt * params.rollAmount * params.rollAmount * 90;\n  params.palette = BARS.map((c) => turn(c, k[0]));\n}\n\nexport function draw(display, params, time) {\n  const w = display.width;\n  const h = display.height;\n  // Damage sets how hard a burst tears, and past the middle the card never\n  // quite settles.\n  const tear = Math.max(params.tear * (0.35 + 0.65 * params.damage), Math.max(0, params.damage - 0.45) * 0.5);\n  const seed = params.seed;\n  const bands = 6 + Math.floor(params.damage * 10);\n  const split = Math.round(tear * 6);\n  const hold = params.rollAmount > 0.02 ? params.roll : 0;\n  for (let y = 0; y \u003c h; y++) {\n    // Torn bands slide sideways; a quiet card still twitches a line now and then.\n    const band = Math.floor((y / h) * bands);\n    const kick = hash(seed, band) \u003c tear * 1.4 ? (hash(seed + 1, band) - 0.5) * 70 * tear : 0;\n    const twitch = hash(Math.floor(params.t * 24), y) \u003c 0.012 + params.damage * 0.02 ? (hash(y, params.t) - 0.5) * 6 : 0;\n    const shift = Math.round(kick + twitch);\n    const sy = Math.floor(y + hold) % (h + 6);\n    for (let x = 0; x \u003c w; x++) {\n      if (sy >= h) {\n        display.setPixel(x, y, 0, 0, 0);\n        continue;\n      }\n      const sample = (sx) => {\n        const xx = ((sx % w) + w) % w;\n        if (sy \u003c h * 0.72) return params.palette[Math.floor((xx / w) * 7)];\n        if (sy \u003c h * 0.8) {\n          const i = 6 - Math.floor((xx / w) * 7);\n          return i % 2 === 0 ? params.palette[i] : [10, 10, 10];\n        }\n        // A grey ramp along the foot of the card.\n        const g = Math.floor((xx / w) * 6) * 40 + 20;\n        return [g, g, g];\n      };\n      const base = x - shift;\n      const r = sample(base - split)[0];\n      const g = sample(base)[1];\n      const b = sample(base + split)[2];\n      // Scanlines dim every other row a touch, more when the picture tears.\n      const dim = y & 1 ? 1 - 0.18 - tear * 0.3 : 1;\n      const snow = hash(x + y * 131, Math.floor(params.t * 30)) \u003c tear * 0.25 ? 120 : 0;\n      display.setPixel(x, y, r * dim + snow, g * dim + snow, b * dim + snow);\n    }\n  }\n}\n","layer":{"id":"layer-test-card","type":"code","name":"test-card","visible":true,"opacity":1,"blend":"normal","role":"paint","maskInvert":false,"code":"// ===== Patternflow pattern =====\n// Title:   Test Card\n// Family:  glitch\n// Idea:    A television's colour bars, as a set that is losing its hold would show them.\n// Author:  patternflow-lab\n// Date:    2026-10-22\n// SPDX-License-Identifier: CC-BY-SA-4.0\n// Lineage: original, pattern study 2026-10\n// ===============================\n// @matrix 128x64\n// @knobs Hue=0..1, Bursts=0.2..6, Damage=0.15..1, Roll=0..1\n//\n// Knob 1: Hue. Turns the whole set of bars round the colour wheel.\n// Knob 2: Bursts. How often the picture tears.\n// Knob 3: Damage. From a clean card with the odd twitch to bars torn apart and smeared.\n// Knob 4: Roll. The vertical hold: the picture starts to slip and roll.\n// Buttons: K1 tap tears the picture now.\n\nconst BARS = [\n  [235, 235, 235],\n  [235, 235, 16],\n  [16, 235, 235],\n  [16, 235, 16],\n  [235, 16, 235],\n  [235, 16, 16],\n  [16, 16, 235],\n];\n\nfunction hash(a, b) {\n  const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453;\n  return s - Math.floor(s);\n}\n\nfunction turn(c, hue) {\n  // Rotate an RGB colour round the grey axis.\n  const a = hue * Math.PI * 2;\n  const cos = Math.cos(a);\n  const sin = Math.sin(a);\n  const k = (1 - cos) / 3;\n  const s3 = Math.sqrt(1 / 3) * sin;\n  const r = c[0] * (cos + k) + c[1] * (k - s3) + c[2] * (k + s3);\n  const g = c[0] * (k + s3) + c[1] * (cos + k) + c[2] * (k - s3);\n  const b = c[0] * (k - s3) + c[1] * (k + s3) + c[2] * (cos + k);\n  return [r, g, b];\n}\n\nexport function setup(params) {\n  params.t = 0;\n  params.tear = 0;\n  params.slot = -1;\n  params.seed = 0;\n  params.roll = 0;\n  params.palette = BARS.map((c) => c.slice());\n}\n\nexport function update(dt, input, params) {\n  const k = input.knobValues || [0, 2, 0.15, 0.06];\n  params.damage = k[2];\n  params.rollAmount = k[3];\n  params.t += dt;\n  const slot = Math.floor(params.t , 10, 10];\n        }\n        // A grey ramp along the foot of the card.\n        const g = Math.floor((xx / w) * 6) * 40 + 20;\n        return [g, g, g];\n      };\n      const base = x - shift;\n      const r = sample(base - split)[0];\n      const g = sample(base)[1];\n      const b = sample(base + split)[2];\n      // Scanlines dim every other row a touch, more when the picture tears.\n      const dim = y & 1 ? 1 - 0.18 - tear * 0.3 : 1;\n      const snow = hash(x + y * 131, Math.floor(params.t * 30)) \u003c tear * 0.25 ? 120 : 0;\n      display.setPixel(x, y, r * dim + snow, g * dim + snow, b * dim + snow);\n    }\n  }\n}\n","ramp":{"stops":[{"position":0,"color":"#000000","alpha":1},{"position":1,"color":"#ffffff","alpha":1}],"mode":"linear","wrap":false},"recolor":false,"knobsAnnotationRaw":"// @knobs Hue=0..1, Bursts=0.2..6, Damage=0.15..1, Roll=0..1","matrixAnnotationRaw":"// @matrix 128x64"},"matrix":{"width":128,"height":64},"knobs":[{"name":"Hue","min":0,"max":1,"about":"Turns the whole set of bars round the colour wheel."},{"name":"Bursts","min":0.2,"max":6,"about":"How often the picture tears."},{"name":"Damage","min":0.15,"max":1,"about":"From a clean card with the odd twitch to bars torn apart and smeared."},{"name":"Roll","min":0,"max":1,"about":"The vertical hold: the picture starts to slip and roll."}],"start":[0,2,0.15,0.06],"measures":{"motion":0.2289,"detail":0.0887,"edges":0.8387,"complexity":0.076,"coverage":0.9188,"colour":0.68,"drift":0.0501},"knobResponse":[0.419,0.0587,0.1001,0.3066]},{"slug":"truchet","title":"Truchet","family":"geometry","note":"","idea":"Every tile holds the same two quarter circles, and turning one tile a quarter turn is enough to join two paths into one or cut one in two.","buttons":"K1 tap turns a quarter of the tiles at once.","code":"// ===== Patternflow pattern =====\n// Title:   Truchet\n// Family:  geometry\n// Idea:    Every tile holds the same two quarter circles, and turning one tile a quarter turn is enough to join two paths into one or cut one in two.\n// Author:  patternflow-lab\n// Date:    2026-10-22\n// SPDX-License-Identifier: CC-BY-SA-4.0\n// Lineage: original, pattern study 2026-10\n// ===============================\n// @matrix 128x64\n// @knobs Hue=0..1, Flip Rate=0..5, Tile=8..20, Thickness=0..1\n//\n// Knob 1: Hue. Turns the path colours around the colour wheel.\n// Knob 2: Flip Rate. How often a wave of quarter turns crosses the panel; at 0 the paths hold still and only the light runs along them.\n// Knob 3: Tile. Tile size in LEDs; small is a dense meander, large a few wide loops.\n// Knob 4: Thickness. Line width, from a thin wire to fat ribbons with small dark holes between them.\n// Buttons: K1 tap turns a quarter of the tiles at once.\n\nfunction hsv(h, s, v) {\n  h = h - Math.floor(h);\n  const i = Math.floor(h * 6);\n  const f = h * 6 - i;\n  const p = v * (1 - s);\n  const q = v * (1 - f * s);\n  const t = v * (1 - (1 - f) * s);\n  const k = i % 6;\n  const r = k === 0 ? v : k === 1 ? q : k === 2 ? p : k === 3 ? p : k === 4 ? t : v;\n  const g = k === 0 ? t : k === 1 ? v : k === 2 ? v : k === 3 ? q : k === 4 ? p : p;\n  const b = k === 0 ? p : k === 1 ? p : k === 2 ? t : k === 3 ? v : k === 4 ? v : q;\n  return [r * 255, g * 255, b * 255];\n}\n\nfunction hash(a, b) {\n  let n = Math.imul(a, 374761393) ^ Math.imul(b, 668265263);\n  n = Math.imul(n ^ (n >>> 13), 1274126177);\n  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;\n}\n\n// Room for tiles down to 4 LEDs, so nothing is allocated after setup.\nconst MAX_TILES = 32 * 16;\nconst MAX_NODES = 17 * 32 + 16 * 33;\nconst HALF_PI = Math.PI / 2;\n// Arcs between two pulses of light.\nconst PULSE = 5;\n\nexport function setup(params) {\n  params.from = new Uint8Array(MAX_TILES);\n  params.to = new Uint8Array(MAX_TILES);\n  params.prog = new Float32Array(MAX_TILES);\n  params.cross = new Int32Array(MAX_TILES);\n  params.bit = new Uint8Array(MAX_TILES);\n  params.cos = new Float32Array(MAX_TILES);\n  params.sin = new Float32Array(MAX_TILES);\n  params.fill = new Float32Array(MAX_TILES);\n  params.arcA = new Int32Array(MAX_TILES * 2);\n  params.arcB = new Int32Array(MAX_TILES * 2);\n  params.arcStart = new Float32Array(MAX_TILES * 2);\n  params.arcRev = new Uint8Array(MAX_TILES * 2);\n  params.arcPeriod = new Float32Array(MAX_TILES * 2);\n  params.arcTarget = new Float32Array(MAX_TILES * 2);\n  params.arcHue = new Float32Array(MAX_TILES * 2);\n  params.arcCol = new Float32Array(MAX_TILES * 2 * 3);\n  params.seen = new Uint8Array(MAX_TILES * 2);\n  params.walk = new Int32Array(MAX_TILES * 2);\n  params.nodeArc = new Int32Array(MAX_NODES * 2);\n  params.colTile = new Int16Array(128);\n  params.colLocal = new Float32Array(128);\n  params.rowTile = new Int16Array(64);\n  params.rowLocal = new Float32Array(64);\n  params.size = 0;\n  params.wave = 0;\n  params.flow = 0;\n  params.kick = 0;\n}\n\nfunction build(params, size) {\n  params.size = size;\n  params.tw = Math.ceil(128 / size);\n  params.th = Math.ceil(64 / size);\n  // The grid is centred, so a size that does not divide the panel crops evenly.\n  const ox = (params.tw * size - 128) / 2;\n  const oy = (params.th * size - 64) / 2;\n  for (let x = 0; x \u003c 128; x++) {\n    const gx = x + 0.5 + ox;\n    params.colTile[x] = Math.floor(gx / size);\n    params.colLocal[x] = gx - params.colTile[x] * size;\n  }\n  for (let y = 0; y \u003c 64; y++) {\n    const gy = y + 0.5 + oy;\n    params.rowTile[y] = Math.floor(gy / size);\n    params.rowLocal[y] = gy - params.rowTile[y] * size;\n  }\n  const n = params.tw * params.th;\n  for (let t = 0; t \u003c n; t++) {\n    const b = hash(t, 7) \u003c 0.5 ? 1 : 0;\n    params.from[t] = b;\n    params.to[t] = b;\n    params.prog[t] = 1;\n    params.cross[t] = -1 \u003c\u003c 30;\n  }\n  params.arcHue.fill(-1);\n  trace(params);\n}\n\n// Join the arcs into paths. Each path is numbered from its lowest edge\n// midpoint, so a path no flip touched keeps its colour and its pulses.\nfunction trace(params) {\n  const tw = params.tw;\n  const th = params.th;\n  const hCount = (th + 1) * tw;\n  const nodes = hCount + th * (tw + 1);\n  const nodeArc = params.nodeArc;\n  nodeArc.fill(-1, 0, nodes * 2);\n  const link = (node, arc) => {\n    if (nodeArc[node * 2] \u003c 0) nodeArc[node * 2] = arc;\n    else nodeArc[node * 2 + 1] = arc;\n  };\n  for (let j = 0; j \u003c th; j++) {\n    for (let i = 0; i \u003c tw; i++) {\n      const t = j * tw + i;\n      const top = j * tw + i;\n      const bottom = (j + 1) * tw + i;\n      const left = hCount + j * (tw + 1) + i;\n      const right = left + 1;\n      const logical = params.prog[t] \u003c 0.5 ? params.from[t] : params.to[t];\n      // Arc 0 starts at the top edge, arc 1 at the bottom edge.\n      params.arcA[t * 2] = top;\n      params.arcB[t * 2] = logical ? right : left;\n      params.arcA[t * 2 + 1] = bottom;\n      params.arcB[t * 2 + 1] = logical ? left : right;\n      link(top, t * 2);\n      link(params.arcB[t * 2], t * 2);\n      link(bottom, t * 2 + 1);\n      link(params.arcB[t * 2 + 1], t * 2 + 1);\n    }\n  }\n  const arcs = tw * th * 2;\n  params.seen.fill(0, 0, arcs);\n  const walk = (start, first) => {\n    let node = start;\n    let arc = first;\n    let len = 0;\n    while (arc >= 0 && !params.seen[arc]) {\n      params.seen[arc] = 1;\n      params.walk[len] = arc;\n      params.arcStart[arc] = len;\n      const forward = params.arcA[arc] === node;\n      params.arcRev[arc] = forward ? 0 : 1;\n      node = forward ? params.arcB[arc] : params.arcA[arc];\n      len++;\n      arc = nodeArc[node * 2] === arc ? nodeArc[node * 2 + 1] : nodeArc[node * 2];\n    }\n    const closed = arc >= 0;\n    // A closed loop fits a whole number of pulses, so it has no seam.\n    const period = closed ? len / Math.max(1, Math.round(len / PULSE)) : PULSE;\n    const r = hash(start, 3);\n    let hue = Math.floor(r * 5) * 0.035 - 0.07;\n    if (hash(start, 11) \u003c 0.12) hue += 0.5;\n    for (let w = 0; w \u003c len; w++) {\n      params.arcPeriod[params.walk[w]] = period;\n      params.arcTarget[params.walk[w]] = hue;\n    }\n  };\n  for (let node = 0; node \u003c nodes; node++) {\n    if (nodeArc[node * 2 + 1] \u003c 0 && nodeArc[node * 2] >= 0 && !params.seen[nodeArc[node * 2]]) walk(node, nodeArc[node * 2]);\n  }\n  for (let node = 0; node \u003c nodes; node++) {\n    const a = nodeArc[node * 2];\n    const b = nodeArc[node * 2 + 1];\n    if (a \u003c 0 || b \u003c 0 || params.seen[a]) continue;\n    const na = params.arcA[a] === node ? params.arcB[a] : params.arcA[a];\n    const nb = params.arcA[b] === node ? params.arcB[b] : params.arcA[b];\n    walk(node, na \u003c nb ? a : b);\n  }\n  for (let a = 0; a \u003c arcs; a++) if (params.arcHue[a] \u003c -0.5) params.arcHue[a] = params.arcTarget[a];\n}\n\nexport function update(dt, input, params) {\n  const k = input.knobValues || [0, 2, 8, 0.06];\n  // K1 at 0 opens on teal rather than the red most of the study opens on.\n  params.hue = k[0] + 0.48;\n  params.rate = k[1];\n  params.thick = k[3];\n  const size = Math.round(k[2]);\n  if (size !== params.size) build(params, size);\n  const tw = params.tw;\n  const th = params.th;\n  const n = tw * th;\n  const kick = input.btnPressed && input.btnPressed[0];\n  if (kick) params.kick++;\n\n  params.wave += dt * params.rate * 0.12;\n  params.flow += dt * 0.45;\n  let dirty = false;\n  for (let t = 0; t \u003c n; t++) {\n    const i = t % tw;\n    const j = (t - i) / tw;\n    // The front runs diagonally, and each pass turns a different third of the tiles.\n    const c = (i + j * 0.7 + 1.5 * Math.sin(j * 0.6)) / (tw + th * 0.7 + 3);\n    const count = Math.floor(params.wave - c);\n    let flip = false;\n    if (count !== params.cross[t]) {\n      if (params.cross[t] !== -1 \u003c\u003c 30 && hash(t, count) \u003c 0.35) flip = true;\n      params.cross[t] = count;\n    }\n    if (kick && hash(t, 1000 + params.kick) \u003c 0.25) flip = true;\n    if (flip && params.prog[t] >= 1) {\n      params.from[t] = params.to[t];\n      params.to[t] = 1 - params.to[t];\n      params.prog[t] = 0;\n    }\n    if (params.prog[t] \u003c 1) {\n      const before = params.prog[t];\n      params.prog[t] = Math.min(1, before + dt / 0.5);\n      if (before \u003c 0.5 && params.prog[t] >= 0.5) dirty = true;\n    }\n    const pr = params.prog[t];\n    params.fill[t] = 1 - Math.sin(pr * Math.PI);\n    if (pr >= 1) {\n      params.bit[t] = params.to[t];\n      params.cos[t] = 1;\n      params.sin[t] = 0;\n    } else {\n      const eased = pr * pr * (3 - 2 * pr);\n      const ang = pr \u003c 0.5 ? eased * HALF_PI : (eased - 1) * HALF_PI;\n      params.bit[t] = pr \u003c 0.5 ? params.from[t] : params.to[t];\n      params.cos[t] = Math.cos(ang);\n      params.sin[t] = Math.sin(ang);\n    }\n  }\n  if (dirty) trace(params);\n  // A path that was joined to another one eases into its new colour.\n  const ease = Math.min(1, dt * 3);\n  for (let a = 0; a \u003c n * 2; a++) {\n    let d = params.arcTarget[a] - params.arcHue[a];\n    d -= Math.round(d);\n    params.arcHue[a] += d * ease;\n    params.arcHue[a] -= Math.floor(params.arcHue[a]);\n    const col = hsv(params.hue + params.arcHue[a], 0.85, 1);\n    params.arcCol[a * 3] = col[0];\n    params.arcCol[a * 3 + 1] = col[1];\n    params.arcCol[a * 3 + 2] = col[2];\n  }\n}\n\nexport function draw(display, params, time) {\n  const S = params.size;\n  const half = S / 2;\n  const tw = params.tw;\n  const hw = 0.8 + params.thick * (S * 0.235 - 0.8);\n  const ground = hsv(params.hue + 0.6, 0.85, 0.16);\n  for (let y = 0; y \u003c 64; y++) {\n    const ty = params.rowTile[y];\n    const ly = params.rowLocal[y] - half;\n    for (let x = 0; x \u003c 128; x++) {\n      const t = ty * tw + params.colTile[x];\n      const lx = params.colLocal[x] - half;\n      const c = params.cos[t];\n      const s = params.sin[t];\n      const px = c * lx + s * ly + half;\n      const py = -s * lx + c * ly + half;\n      let d0;\n      let d1 wo quarter circles, and turning one tile a quarter turn is enough to join two paths into one or cut one in two.\n// Author:  patternflow-lab\n// Date:    2026-10-22\n// SPDX-License-Identifier: CC-BY-SA-4.0\n// Lineage: original, pattern study 2026-10\n// ===============================\n// @matrix 128x64\n// @knobs Hue=0..1, Flip Rate=0..5, Tile=8..20, Thickness=0..1\n//\n// Knob 1: Hue. Turns the path colours around the colour wheel.\n// Knob 2: Flip Rate. How often a wave of quarter turns crosses the panel; at 0 the paths hold still and only the light runs along them.\n// Knob 3: Tile. Tile size in LEDs; small is a dense meander, large a few wide loops.\n// Knob 4: Thickness. Line width, from a thin wire to fat ribbons with small dark holes between them.\n// Buttons: K1 tap turns a quarter of the tiles at once.\n\nfunction hsv(h, s, v) {\n  h = h - Math.floor(h);\n  const i = Math.floor(h * 6);\n  const f = h * 6 - i;\n  const p = v * (1 - s);\n  const q = v * (1 - f * s);\n  const t = v * (1 - (1 - f) * s);\n  const k = i % 6;\n  const r = k === 0 ? v : k === 1 ? q : k === 2 ? p : k === 3 ? p : k === 4 ? t : v;\n  const g = k === 0 ? t : k === 1 ? v : k === 2 ? v : k === 3 ? q : k === 4 ? p : p;\n  const b = k === 0 ? p : k === 1 ? p : k === 2 ? t : k === 3 ? v : k === 4 ? v : q;\n  return [r * 255, g * 255, b * 255];\n}\n\nfunction hash(a, b) {\n  let n = Math.imul(a, 374761393) ^ Math.imul(b, 668265263);\n  n = Math.imul(n ^ (n >>> 13), 1274126177);\n  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;\n}\n\n// Room for tiles down to 4 LEDs, so nothing is allocated after setup.\nconst MAX_TILES = 32 * 16;\nconst MAX_NODES = 17 * 32 + 16 * 33;\nconst HALF_PI = Math.PI / 2;\n// Arcs between two pulses of light.\nconst PULSE = 5;\n\nexport function setup(params) {\n  params.from = new Uint8Array(MAX_TILES);\n  params.to = new Uint8Array(MAX_TILES);\n  params.prog = new Float32Array(MAX_TILES);\n  params.cross = new Int32Array(MAX_TILES);\n  params.bit = new Uint8Array t, so a path no flip touched keeps its colour and its pulses.\nfunction trace(params) {\n  const tw = params.tw;\n  const th = params.th;\n  const hCount = (th + 1) * tw;\n  const nodes = hCount + th * (tw + 1);\n  const nodeArc = params.nodeArc;\n  nodeArc.fill(-1, 0, nodes * 2);\n  const link = (node, arc) => {\n    if (nodeArc[node * 2] \u003c 0) nodeArc[node * 2] = arc;\n    else nodeArc[node * 2 + 1] = arc;\n  };\n  for (let j = 0; j \u003c th; j++) {\n    for (let i = 0; i \u003c tw; i++) {\n      const t = j * tw + i;\n      const top = j * tw + i;\n      const bottom = (j + 1) * tw + i;\n      const left = hCount + j * (tw + 1) + i;\n      const right = left + 1;\n      const logical = params.prog[t] \u003c 0.5 ? params.from[t] : params.to[t];\n      // Arc 0 starts at the top edge, arc 1 at the bottom edge.\n      params.arcA[t * 2] = top;\n      params.arcB[t * 2] = logical ? right : left;\n      params.arcA[t * 2 + 1] = bottom;\n      params.arcB[t * 2 + 1] = logical ? left : right;\n      link(top, t * 2);\n      link(params.arcB[t * 2], t * 2);\n      link(bottom, t * 2 + 1);\n      link(params.arcB[t * 2 + 1], t * 2 + 1);\n    }\n  }\n  const arcs = tw * th * 2;\n  params.seen.fill(0, 0, arcs);\n  const walk = (start, first) => {\n    let node = start;\n    let arc = first;\n    let len = 0;\n    while (arc >= 0 && !params.seen[arc]) {\n      params.seen[arc] = 1;\n      params.walk[len] = arc;\n      params.arcStart[arc] = len;\n      const forward = params.arcA[arc] === node;\n      params.arcRev[arc] = forward ? 0 : 1;\n      node = forward ? params.arcB[arc] : params.arcA[arc];\n      len++;\n      arc = nodeArc[node * 2] === arc ? nodeArc[node * 2 + 1] : nodeArc[node * 2];\n    }\n    const closed = arc >= 0;\n    // A closed loop fits a whole number of pulses, so it has no seam.\n    const period = closed ? len / Math.max(1, Math.round(len / PULSE)) : PULSE;\n    const r = hash(start, 3);\n    let hue = Math.floor(r * 5) * 0.035 - 0.07;\n    if (
