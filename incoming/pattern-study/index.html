24, 20, 18, 17,\n  17, 17, 25, 21, 19, 17, 17,\n  30, 17, 17, 30, 17, 17, 30,\n];\n\nfunction hsv(h, s, v, out) {\n  h = h - Math.floor(h);\n  const i = Math.floor(h * 6);\n  const f = h * 6 - i;\n  const p = v * (1 - s);\n  const q = v * (1 - f * s);\n  const t = v * (1 - (1 - f) * s);\n  const k = i % 6;\n  out[0] = (k === 0 || k === 5 ? v : k === 1 ? q : k === 4 ? t : p) * 255;\n  out[1] = (k === 1 || k === 2 ? v : k === 0 ? t : k === 3 ? q : p) * 255;\n  out[2] = (k === 3 || k === 4 ? v : k === 2 ? t : k === 5 ? q : p) * 255;\n}\n\nfunction hash(n) {\n  let x = (Math.imul(n | 0, 374761393) + 668265263) >>> 0;\n  x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;\n  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;\n}\n\n// Lays a word out: glyph offsets into FONT, and its scale and origin.\nfunction setWord(p, slot, index) {\n  const word = WORDS[index];\n  const L = p.layout[slot];\n  L.n = word.length;\n  for (let i = 0; i \u003c L.n; i++) L.bits[i] = p.big[LETTERS.indexOf(word[i])];\n  const cols = L.n * 6 - 1;\n  L.cols = cols;\n  L.sx = Math.min(10, Math.floor(124 / cols));\n  L.sy = 8;\n  L.x0 = Math.floor((W - cols * L.sx) / 2);\n  L.y0 = 4;\n}\n\n// Scale2x (EPX) on a bitmap: square corners stay, a diagonal step gets joined.\nfunction epx(src, w, h) {\n  const out = new Uint8Array(w * h * 4);\n  const at = (x, y) => (x \u003c 0 || y \u003c 0 || x >= w || y >= h ? 0 : src[y * w + x]);\n  for (let y = 0; y \u003c h; y++) {\n    for (let x = 0; x \u003c w; x++) {\n      const P = at(x, y);\n      const A = at(x, y - 1);\n      const B = at(x + 1, y);\n      const C = at(x - 1, y);\n      const D = at(x, y + 1);\n      const o = y * 2 * w * 2 + x * 2;\n      out[o] = C === A && C !== D && A !== B ? A : P;\n      out[o + 1] = A === B && A !== C && B !== D ? B : P;\n      out[o + w * 2] = D === C && D !== B && C !== A ? C : P;\n      out[o + w * 2 + 1] = B === D && B !== A && D !== C ? D : P;\n    }\n  }\n  return out;\n}\n\nfunction inside(L, u, v) {\n  if (u \u003c 0 || v \u003c 0) return 0;\n  const cu = Math.floor((u * ZOOM) / L.sx);\n  const cv = Math.floor((v * ZOOM) / L.sy);\n  if (cu >= L.cols * ZOOM || cv >= 7 * ZOOM) return 0;\n  const letter = Math.floor(cu / (6 * ZOOM));\n  const b = cu - letter * 6 * ZOOM;\n  if (b >= 5 * ZOOM) return 0;\n  return L.bits[letter][cv * 5 * ZOOM + b];\n}\n\nexport function setup(params) {\n  params.phase = 0;\n  params.roll = 1;\n  params.word = -1;\n  params.layout = [\n    { n: 0, cols: 0, sx: 1, sy: 1, x0: 0, y0: 0, bits: [] },\n    { n: 0, cols: 0, sx: 1, sy: 1, x0: 0, y0: 0, bits: [] },\n  ];\n  params.big = [];\n  for (let g = 0; g \u003c LETTERS.length; g++) {\n    const bits = new Uint8Array(35);\n    for (let r = 0; r \u003c 7; r++) for (let c = 0; c \u003c 5; c++) bits[r * 5 + c] = (FONT[g * 7 + r] >> (4 - c)) & 1;\n    params.big.push(epx(bits, 5, 7));\n  }\n  params.mask = new Uint8Array(W * H);\n  params.rowShift = new Float32Array(H);\n  params.colShift = new Float32Array(W);\n  params.line = [0, 0, 0];\n  params.fill = [0, 0, 0];\n  params.shade = [0, 0, 0];\n}\n\nexport function update(dt, input, params) {\n  const p = params;\n  const k = input.knobValues || [0, 2, 0, 0.06];\n  p.hue = k[0];\n  p.speed = k[1];\n  p.warp = k[3];\n  const index = Math.max(0, Math.min(WORDS.length - 1, Math.round(k[2])));\n  if (p.word \u003c 0) {\n    setWord(p, 0, index);\n    p.word = index;\n  } else if (index !== p.word) {\n    // The old word rolls up out of frame and the new one follows it in.\n    p.layout.reverse();\n    setWord(p, 0, index);\n    p.word = index;\n    p.roll = 0;\n  }\n  p.roll = Math.min(1, p.roll + dt * 3);\n  p.phase += dt * p.speed;\n}\n\nexport function draw(display, params, time) {\n  const p = params;\n  const warp = p.warp;\n  const ph = p.phase;\n  const amp = 1.5 + warp * 6;\n  const lambda = 52 - warp * 12;\n  const shear = warp * 0.18 * Math.sin(ph * 0.45);\n  // Above half warp a band of rows slips sideways now and then, like lost sync.\n  const slot = Math.floor(ph * 3);\n  const tearY = hash(slot) * H;\n  const tearH = 2 + hash(slot + 7) * 7;\n  const tear = warp > 0.5 && hash(slot + 3) \u003c 0.6 ? (hash(slot + 11) - 0.5) * 60 * (warp - 0.5) : 0;\n  for (let y = 0; y \u003c H; y++) {\n    let s = amp * Math.sin((y / lambda) * 6.2832 - ph * 2.4) + shear * (y - 32);\n    if (tear !== 0 && y >= tearY && y \u003c tearY + tearH) s += tear;\n    p.rowShift[y] = s;\n  }\n  for (let x = 0; x \u003c W; x++) p.colShift[x] = warp * 3 * Math.sin((x / 70) * 6.2832 + ph * 1.3);\n\n  const e = p.roll * p.roll * (3 - 2 * p.roll);\n  const now = p.layout[0];\n  const old = p.layout[1];\n  const rolling = p.roll \u003c 1;\n  const mask = p.mask;\n  for (let y = 0; y \u003c H; y++) {\n    for (let x = 0; x \u003c W; x++) {\n      const u = x - p.rowShift[y];\n      const v = y - p.colShift[x];\n      let m = inside(now, u - now.x0, v - now.y0 - (rolling ? (1 - e) * H : 0));\n      if (rolling && !m) m = inside(old, u - old.x0, v - old.y0 + e * H);\n      mask[y * W + x] = m;\n    }\n  }\n\n  hsv(p.hue, 0.75, 1, p.line);\n  hsv(p.hue + 0.07, 0.95, 1, p.fill);\n  hsv(p.hue + 0.55, 0.9, 0.32, p.shade);\n  const line = p.line;\n  const fill = p.fill;\n  const shade = p.shade;\n  const bar = ((ph * 18) % (H + 24)) - 12;\n  const sdx = 2;\n  const sdy = 2;\n  for (let y = 0; y \u003c H; y++) {\n    const glow = Math.max(0, 1 - Math.abs(y - bar) / 7);\n    const lit = (y & 1) === 0 ? 0.3 + glow * 0.6 : glow * 0.35;\n    for (let x = 0; x \u003c W; x++) {\n      const i = y * W + x;\n      if (mask[i]) {\n        const edge =\n          x === 0 || y === 0 || x === W - 1 || y === H - 1 ||\n          !mask[i - 1] || !mask[i + 1] || !mask[i - W] || !mask[i + W];\n        if (edge) display.setPixel(x, y, line[0], line[1], line[2]);\n        else display.setPixel(x, y, fill[0] * lit, fill[1] * lit, fill[2] * lit);\n      } else if (x >= sdx && y >= sdy && mask[i - sdy * W - sdx]) {\n        display.setPixel(x, y, shade[0], shade[1], shade[2]);\n      } else {\n        display.setPixel(x, y, 0, 0, 0);\n      }\n    }\n  }\n}\n","layer":{"id":"layer-big-type","type":"code","name":"big-type","visible":true,"opacity":1,"blend":"normal","role":"paint","maskInvert":false,"code":"// ===== Patternflow pattern =====\n// Title:   Big Type\n// Family:  type\n// Idea:    One word as big as the screen will hold, on a set that cannot keep it still, the way a magnet bends the picture on an old television.\n// Author:  patternflow-lab\n// Date:    2026-10-22\n// SPDX-License-Identifier: CC-BY-SA-4.0\n// Lineage: original, pattern study 2026-10\n// ===============================\n// @matrix 128x64\n// @knobs Hue=0..1, Speed=0.2..5, Word=0..6, Warp=0..1\n//\n// Knob 1: Hue. Turns the outline colour; the fill and the shadow follow it.\n// Knob 2: Speed. How fast the wave runs down the word and the bright scan bar rolls.\n// Knob 3: Word. Picks the word: TV, 1963, LIGHT, HELLO, FLOW, PLAY, KNOB.\n// Knob 4: Warp. How hard the picture bends, from a slow sway to a set losing its hold.\n\nconst W = 128;\nconst H = 64;\n\n// The font is drawn from its Scale2x copy, ten by fourteen cells a glyph.\nconst ZOOM = 2;\n\nconst WORDS = [\"TV\", \"1963\", \"LIGHT\", \"HELLO\", \"FLOW\", \"PLAY\", \"KNOB\"];\n\n// 5x7 glyphs, seven rows each from the top, 16 is the left column.\nconst LETTERS = \"TV1963LIGHEOFWPAYKNB\";\nconst FONT = [\n  31, 4, 4, 4, 4, 4, 4,\n  17, 17, 17, 17, 17, 10, 4,\n  4, 12, 4, 4, 4, 4, 14,\n  14, 17, 17, 15, 1, 2, 12,\n  6, 8, 16, 30, 17, 17, 14,\n  31, 2, 4, 2, 1, 17, 14,\n  16, 16, 16, 16, 16, 16, 31,\n  14, 4, 4, 4, 4, 4, 14,\n  14, 17, 16, 23, 17, 17, 15,\n  17, 17, 17, 31, 17, 17, 17,\n  31, 16, 16, 30, 16, 16, 31,\n  14, 17, 17, 17, 17, 17, 14,\n  31, 16, 16, 30, 16, 16, 16,\n  17, 17, 17, 21, 21, 21, 10,\n  30, 17, 17, 30, 16, 16, 16,\n  14, 17, 17, 31, 17, 17, 17,\n  17, 17, 10, 4, 4, 4, 4,\n  17, 18, 20, 24, 20, 18, 17,\n  17, 17, 25, 21, 19, 17, 17,\n  30, 17, 17, 30, 17, 17, 30,\n];\n\nfunction hsv(h, s, v, out) {\n  h = h - Math.floor(h);\n  const i = Math.floor(h * 6);\n  const f = h * 6 - i;\n  const p = v * (1 - s);\n  const q = v * (1 - f * s);\n  const t = v * (1 - (1 - f) * s);\n  const k = i % 6;\n  out[0] = (k === 0 || k === 5 ? v : k === 1 ? q : k === 4 ? t : p) * 255;\n  out[1] = (k === 1 || k === 2 ? v : k === 0 ? t : k === 3 ? q : p) * 255;\n  out[2] = (k === 3 || k === 4 ? v : k === 2 ? t : k === 5 ? q : p) * 255;\n}\n\nfunction hash(n) {\n  let x = (Math.imul(n | 0, 374761393) + 668265263) >>> 0;\n  x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;\n  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;\n}\n\n// Lays a word out: glyph offsets into FONT, and its scale and origin.\nfunction setWord(p, slot, index) {\n  const word = WORDS[index];\n  const L = p.layout[slot];\n  L.n = word.length;\n  for (let i = 0; i \u003c L.n; i++) L.bits[i] = p.big[LETTERS.indexOf(word[i])];\n  const cols = L.n * 6 - 1;\n  L.cols = cols;\n  L.sx = Math.min(10, Math.floor(124 / cols));\n  L.sy = 8;\n  L.x0 = Math.floor((W - cols * L.sx) / 2);\n  L.y0 = 4;\n}\n\n// Scale2x (EPX) on a bitmap: square corners stay, a diagonal step gets joined.\nfunction epx(src, w, h) {\n  const out = new Uint8Array(w * h * 4);\n  const at = (x, y) => (x \u003c 0 || y \u003c 0 || x >= w || y >= h ? 0 : src[y * w + x]);\n  for (let y = 0; y \u003c h; y++) {\n    for (let x = 0; x \u003c w; x++) {\n      const P = at(x, y);\n      const A = at(x, y - 1);\n      const B = at(x + 1, y);\n      const C = at(x - 1, y);\n      const D = at(x, y + 1);\n      const o = y * 2 * w * 2 + x * 2;\n      out[o] = C === A && C !== D && A !== B ? A : P;\n      out[o + 1] = A === B && A !== C && B !== D ? B : P;\n      out[o + w * 2] = D === C && D !== B && C !== A ? C : P;\n      out[o + w * 2 + 1] = B === D && B !== A && D !== C ? D : P;\n    }\n  }\n  return out;\n}\n\nfunction inside(L, u, v) {\n  if (u \u003c 0 || v \u003c 0) return 0;\n  const cu = Math.floor((u * ZOOM) / L.sx);\n  const cv = Math.floor((v * ZOOM) / L.sy);\n  if (cu >= L.cols * ZOOM || cv >= 7 * ZOOM) return 0;\n  const letter = Math.floor(cu / (6 * ZOOM));\n  const b = cu - letter * 6 * ZOOM;\n  if (b >= 5 * ZOOM) return 0;\n  return L.bits[letter][cv * 5 * ZOOM + b];\n}\n\nexport function setup(params) {\n  params.phase = 0;\n  params.roll = 1;\n  params.word = -1;\n  params.layout = [\n    { n: 0, cols: 0, sx: 1, sy: 1, x0: 0, y0: 0, bits: [] },\n    { n: 0, cols: 0, sx: 1, sy: 1, x0: 0, y0: 0, bits: [] },\n  ];\n  params.big = [];\n  for (let g = 0; g \u003c LETTERS.length; g++) {\n    const bits = new Uint8Array(35);\n    for (let r = 0; r \u003c 7; r++) for (let c = 0; c \u003c 5; c++) bits[r * 5 + c] = (FONT[g * 7 + r] >> (4 - c)) & 1;\n    params.big.push(epx(bits, 5, 7));\n  }\n  params.mask = new Uint8Array(W * H);\n  params.rowShift = new Float32Array(H);\n  params.colShift = new Float32Array(W);\n  params.line = [0, 0, 0];\n  params.fill = [0, 0, 0];\n  params.shade = [0, 0, 0];\n}\n\nexport function update(dt, input, params) {\n  const p = params;\n  const k = input.knobValues || [0, 2, 0, 0.06];\n  p.hue = k[0];\n  p.speed = k[1];\n  p.warp = k[3];\n  const index = Math.max(0, Math.min(WORDS.length - 1, Math.round(k[2])));\n  if (p.word \u003c 0) {\n    setWord(p, 0, index);\n    p.word = index;\n  } else if (index !== p.word) {\n    // The old word rolls up out of frame and the new one follows it in.\n    p.layout.reverse();\n    setWord(p, 0, index);\n    p.word = index;\n    p.roll = 0;\n  }\n  p.roll = Math.min(1, p.roll + dt * 3);\n  p.phase += dt * p.speed;\n}\n\nexport function draw(display, params, time) {\n  const p = params;\n  const warp = p.warp;\n  const ph = p.phase;\n  const amp = 1.5 + warp * 6;\n  const lambda = 52 - warp * 12;\n  const shear = warp * 0.18 * Math.sin(ph * 0.45);\n  // Above half warp a band of rows slips sideways now and then, like lost sync.\n  const slot = Math.floor(ph * 3);\n  const tearY = hash(slot) * H;\n  const tearH = 2 + hash(slot + 7) * 7;\n  const tear = warp > 0.5 && hash(slot + 3) \u003c 0.6 ? (hash(slot + 11) - 0.5) * 60 * (warp - 0.5) : 0;\n  for (let y = 0; y \u003c H; y++) {\n    let s = amp * Math.sin((y / lambda) * 6.2832 - ph * 2.4) + shear * (y - 32);\n    if (tear !== 0 && y >= tearY && y \u003c tearY + tearH) s += tear;\n    p.rowShift[y] = s;\n  }\n  for (let x = 0; x \u003c W; x++) p.colShift[x] = warp * 3 * Math.sin((x / 70) * 6.2832 + ph * 1.3);\n\n  const e = p.roll * p.roll * (3 - 2 * p.roll);\n  const now = p.layout[0];\n  const old = p.layout[1];\n  const rolling = p.roll \u003c 1;\n  const mask = p.mask;\n  for (let y = 0; y \u003c H; y++) {\n    for (let x = 0; x \u003c W; x++) {\n      const u = x - p.rowShift[y];\n      const v = y - p.colShift[x];\n      let m = inside(now, u - now.x0, v - now.y0 - (rolling ? (1 - e) * H : 0));\n      if (rolling && !m) m = inside(old, u - old.x0, v - old.y0 + e * H);\n      mask[y * W + x] = m;\n    }\n  }\n\n  hsv(p.hue, 0.75, 1, p.line);\n  hsv(p.hue + 0.07, 0.95, 1, p.fill);\n  hsv(p.hue + 0.55, 0.9, 0.32, p.shade);\n  const line = p.line;\n  const fill = p.fill;\n  const shade = p.shade;\n  const bar = ((ph * 18) % (H + 24)) - 12;\n  const sdx = 2;\n  const sdy = 2;\n  for (let y = 0; y \u003c H; y++) {\n    const glow = Math.max(0, 1 - Math.abs(y - bar) / 7);\n    const lit = (y & 1) === 0 ? 0.3 + glow * 0.6 : glow * 0.35;\n    for (let x = 0; x \u003c W; x++) {\n      const i = y * W + x;\n      if (mask[i]) {\n        const edge =\n          x === 0 || y === 0 || x === W - 1 || y === H - 1 ||\n          !mask[i - 1] || !mask[i + 1] || !mask[i - W] || !mask[i + W];\n        if (edge) display.setPixel(x, y, line[0], line[1], line[2]);\n        else display.setPixel(x, y, fill[0] * lit, fill[1] * lit, fill[2] * lit);\n      } else if (x >= sdx && y >= sdy && mask[i - sdy * W - sdx]) {\n        display.setPixel(x, y, shade[0], shade[1], shade[2]);\n      } else {\n        display.setPixel(x, y, 0, 0, 0);\n      }\n    }\n  }\n}\n","ramp":{"stops":[{"position":0,"color":"#000000","alpha":1},{"position":1,"color":"#ffffff","alpha":1}],"mode":"linear","wrap":false},"recolor":false,"knobsAnnotationRaw":"// @knobs Hue=0..1, Speed=0.2..5, Word=0..6, Warp=0..1","matrixAnnotationRaw":"// @matrix 128x64"},"matrix":{"width":128,"height":64},"knobs":[{"name":"Hue","min":0,"max":1,"about":"Turns the outline colour; the fill and the shadow follow it."},{"name":"Speed","min":0.2,"max":5,"about":"How fast the wave runs down the word and the bright scan bar rolls."},{"name":"Word","min":0,"max":6,"about":"Picks the word: TV, 1963, LIGHT, HELLO, FLOW, PLAY, KNOB."},{"name":"Warp","min":0,"max":1,"about":"How hard the picture bends, from a slow sway to a set losing its hold."}],"start":[0,2,0,0.06],"measures":{"motion":0.4486,"detail":0.0904,"edges":0.9989,"complexity":0.0685,"coverage":0.2261,"colour":0.2494,"drift":0.0626},"knobResponse":[0.0806,0.0499,0.1357,0.0804]},{"slug":"euclid-pulse","title":"Euclid Pulse","family":"rhythm","note":"","idea":"Spread a few beats as evenly as they will go over a ring of steps and a good many of the world's drum patterns fall out, so the panel plays three of them at once.","buttons":"K3 tap turns the outer rhythm one step later.","code":"// ===== Patternflow pattern =====\n// Title:   Euclid Pulse\n// Family:  rhythm\n// Idea:    Spread a few beats as evenly as they will go over a ring of steps and a good many of the world's drum patterns fall out, so the panel plays three of them at once.\n// Author:  patternflow-lab\n// Date:    2026-10-22\n// SPDX-License-Identifier: CC-BY-SA-4.0\n// Lineage: original, pattern study 2026-10\n// ===============================\n// @matrix 128x64\n// @knobs Hue=0..1, Tempo=80..180, Pulses=3..13, Steps=8..16\n//\n// Knob 1: Hue. Turns the three rings around the colour wheel together.\n// Knob 2: Tempo. Beats per minute; the hand goes round once every four beats.\n// Knob 3: Pulses. Hits on the outer ring; the middle ring takes about half as many.\n// Knob 4: Steps. Steps on the outer ring; the middle ring has three for every four of them.\n// Buttons: K3 tap turns the outer rhythm one step later.\n\nconst W = 128;\nconst H = 64;\nconst CX = 63.5;\nconst CY = 31.5;\nconst MAX_STEPS = 32;\nconst RIPPLES = 24;\n\n// Ring bands in LEDs from the centre: outer, middle, inner.\nconst R_IN = [24.5, 16.5, 9];\nconst R_OUT = [30.5, 21.5, 13];\n\nfunction hsv(h, s, v, out) {\n  h = h - Math.floor(h);\n  const i = Math.floor(h * 6);\n  const f = h * 6 - i;\n  const p = v * (1 - s);\n  const q = v * (1 - f * s);\n  const t = v * (1 - (1 - f) * s);\n  const k = i % 6;\n  out[0] = (k === 0 || k === 5 ? v : k === 1 ? q : k === 4 ? t : p) * 255;\n  out[1] = (k === 1 || k === 2 ? v : k === 0 ? t : k === 3 ? q : p) * 255;\n  out[2] = (k === 3 || k === 4 ? v : k === 2 ? t : k === 5 ? q : p) * 255;\n}\n\n// k hits over n steps, as evenly as they go. This is the same necklace\n// Bjorklund's algorithm builds, read off with a modulo instead of recursion.\nfunction euclid(p, ring, k, n, rot) {\n  p.n[ring] = n;\n  for (let s = 0; s \u003c n; s++) {\n    const t = (s - rot + n * 4) % n;\n    p.hits[ring * MAX_STEPS + s] = (t * k) % n \u003c k ? 1 : 0;\n  }\n}\n\n// A ripple leaves the outer edge as an arc facing the step that fired; wide 0\n// sends it all the way round.\nfunction spawn(p, ring, strength, angle, wide) {\n  let slot = 0;\n  for (let i = 0; i \u003c RIPPLES; i++) {\n    if (p.rAge[i] >= 1) {\n      slot = i;\n      break;\n    }\n    if (p.rAge[i] > p.rAge[slot]) slot = i;\n  }\n  p.rAge[slot] = 0;\n  p.rRing[slot] = ring;\n  p.rPower[slot] = strength;\n  p.rAngle[slot] = angle;\n  p.rWide[slot] = wide;\n}\n\nexport function setup(params) {\n  const p = params;\n  p.beats = 0;\n  p.rot = 0;\n  p.n = new Int32Array(3);\n  p.hits = new Uint8Array(3 * MAX_STEPS);\n  p.env = new Float32Array(3 * MAX_STEPS);\n  p.last = new Int32Array([-1, -1, -1]);\n  p.down = 0;\n  p.rAge = new Float32Array(RIPPLES).fill(1);\n  p.rRing = new Uint8Array(RIPPLES);\n  p.rPower = new Float32Array(RIPPLES);\n  p.rAngle = new Float32Array(RIPPLES);\n  p.rWide = new Float32Array(RIPPLES);\n  p.dist = new Float32Array(W * H);\n  p.turn = new Float32Array(W * H);\n  for (let y = 0; y \u003c H; y++) {\n    for (let x = 0; x \u003c W; x++) {\n      const dx = x - CX;\n      const dy = y - CY;\n      p.dist[y * W + x] = Math.hypot(dx, dy);\n      // 0 at twelve o'clock, growing clockwise.\n      const a = Math.atan2(dx, -dy) / 6.2832;\n      p.turn[y * W + x] = a \u003c 0 ? a + 1 : a;\n    }\n  }\n  p.col = [\n    [0, 0, 0],\n    [0, 0, 0],\n    [0, 0, 0],\n  ];\n}\n\nexport function update(dt, input, params) {\n  const p = params;\n  const k = input.knobValues || [0, 80, 3, 8];\n  p.hue = k[0];\n  p.bpm = k[1];\n  if (input.btnPressed && input.btnPressed[2]) p.rot++;\n  const pulses = Math.round(k[2]);\n  const steps = Math.max(Math.round(k[3]), pulses + 1);\n  const mid = Math.max(3, Math.round(steps * 0.75));\n  euclid(p, 0, pulses, steps, p.rot % steps);\n  euclid(p, 1, Math.min(mid - 1, Math.round(pulses * 0.5) + 1), mid, 1);\n  euclid(p, 2, 4, 4, 0);\n\n  p.beats += (dt * p.bpm) / 60;\n  const bar = p.beats / 4;\n  p.hand = bar - Math.floor(bar);\n  const fade = Math.exp(-dt * 5.5);\n  for (let i = 0; i \u003c 3 * MAX_STEPS; i++) p.env[i] *= fade;\n  p.down *= Math.exp(-dt * 4);\n  for (let ring = 0; ring \u003c 3; ring++) {\n    const n = p.n[ring];\n    const step = Math.floor(p.hand * n);\n    if (step !== p.last[ring]) {\n      p.last[ring] = step;\n      if (p.hits[ring * MAX_STEPS + step]) {\n        p.env[ring * MAX_STEPS + step] = 1;\n        const angle = (step + 0.5) / n;\n        if (ring === 2 && step === 0) {\n          p.down = 1;\n          spawn(p, 2, 0.8, 0, 0);\n        } else spawn(p, ring, ring === 0 ? 1 : ring === 1 ? 0.85 : 0.6, angle, ring === 2 ? 0.2 : 0.13);\n      }\n    }\n  }\n  for (let i = 0; i \u003c RIPPLES; i++) p.rAge[i] = Math.min(1, p.rAge[i] + dt / 1.4);\n}\n\nexport function draw(display, params, time) {\n  const p = params;\n  hsv(p.hue, 0.9, 1, p.col[0]);\n  hsv(p.hue + 0.12, 0.85, 1, p.col[1]);\n  hsv(p.hue + 0.5, 0.7, 1, p.col[2]);\n  const hand = p.hand;\n  const hx = Math.sin(hand * 6.2832);\n  const hy = -Math.cos(hand * 6.2832);\n  for (let y = 0; y \u003c H; y++) {\n    for (let x = 0; x \u003c W; x++) {\n      const i = y * W + x;\n      const r = p.dist[i];\n      const a = p.turn[i];\n      let R = 0;\n      let G = 0;\n      let B = 0;\n      let ring = -1;\n      for (let j = 0; j \u003c 3; j++) if (r >= R_IN[j] - 0.5 && r \u003c= R_OUT[j] + 0.5) ring = j;\n      if (ring >= 0) {\n        const n = p.n[ring];\n        const pos = a * n;\n        const s = Math.floor(pos);\n        const local = pos - s;\n        const mid = (R_IN[ring] + R_OUT[ring]) / 2;\n        // A gap of about one LED between neighbouring steps.\n        const gap = (0.6 * n) / (6.2832 * r);\n        const edge = Math.min(r - R_IN[ring], R_OUT[ring] - r) + 0.5;\n        if (local > gap && local \u003c 1 - gap) {\n          const hit = p.hits[ring * MAX_STEPS + s];\n          const env = p.env[ring * MAX_STEPS + s];\n          const here = s === Math.floor(hand * n);\n          const soft = Math.max(0, Math.min(1, edge));\n          let v = 0;\n          let white = 0;\n          if (hit) {\n            v = Math.max(0.3 + 0.7 * env, here ? 0.5 : 0) * soft;\n            white = env * env * 0.55;\n          } else if (Math.abs(r - mid) \u003c 1) {\n            // A rest is a thin line, lit up while the hand is on it.\n            v = here ? 0.5 : 0.16;\n          }\n          const c = p.col[ring];\n          R = (c[0] * (1 - white) + 255 * white) * v;\n          G = (c[1] * (1 - white) + 255 * white) * v;\n          B = (c[2] * (1 - white) + 255 * white) * v;\n        }\n      } else if (r \u003c 5) {\n        const v = 0.18 + 0.82 * p.down;\n        R = 255 * v;\n        G = 255 * v;\n        B = 255 * v;\n      } else if (r > R_OUT[0] + 1) {\n        for (let q = 0; q \u003c RIPPLES; q++) {\n          const age = p.rAge[q];\n          if (age >= 1) continue;\n          const front = R_OUT[0] + 1 + age * 62;\n          const d = Math.abs(r - front);\n          if (d > 2.2) continue;\n          let v = p.rPower[q] * (1 - age) * Math.sqrt(1 - age) * (1 - d / 2.2);\n          const wide = p.rWide[q];\n          if (wide > 0) {\n            let da = Math.abs(a - p.rAngle[q]);\n            if (da > 0.5) da = 1 - da;\n            const span = wide * (0.8 + age * 1.4);\n            if (da > span) continue;\n            v *= 1 - (da / span) * (da / span);\n          }\n          const c = p.col[p.rRing[q]];\n          R += c[0] * v;\n          G += c[1] * v;\n          B += c[2] * v;\n        }\n      }\n      // The hand: a thin spoke through the rings.\n      if (r > 5 && r \u003c R_OUT[0] + 0.5) {\n        const dx = x - CX;\n        const dy = y - CY;\n        const along = dx * hx + dy * hy;\n        const v = along > 0 ? 1 - Math.abs(dx * hy - dy * hx) / 0.9 : 0;\n        if (v > 0) {\n          R = Math.max(R, 170 * v);\n          G = Math.max(G, 170 * v);\n          B = Math.max(B, 170 * v);\n        }\n      }\n      display.setPixel(x, y, R, G, B);\n    }\n  }\n}\n","layer":{"id":"layer-euclid-pulse","type":"code","name":"euclid-pulse","visible":true,"opacity":1,"blend":"normal","role":"paint","maskInvert":false,"code":"// ===== Patternflow pattern =====\n// Title:   Euclid Pulse\n// Family:  rhythm\n// Idea:    Spread a few beats as evenly as they will go over a ring of steps and a good many of the world's drum patterns fall out, so the panel plays three of them at once.\n// Author:  patternflow-lab\n// Date:    2026-10-22\n// SPDX-License-Identifier: CC-BY-SA-4.0\n// Lineage: original, pattern study 2026-10\n// ===============================\n// @matrix 128x64\n// @knobs Hue=0..1, Tempo=80..180, Pulses=3..13, Steps=8..16\n//\n// Knob 1: Hue. Turns the three rings around the colour wheel together.\n// Knob 2: Tempo. Beats per minute; the hand goes round once every four beats.\n// Knob 3: Pulses. Hits on the outer ring; the middle ring takes about half as many.\n// Knob 4: Steps. Steps on the outer ring; the middle ring has three for every four of them.\n// Buttons: K3 tap turns the outer rhythm one step later.\n\nconst W = 128;\nconst H = 64;\nconst CX = 63.5;\nconst CY = 31.5;\nconst MAX_STEPS = 32;\nconst RIPPLES = 24;\n\n// Ring bands in LEDs from the centre: outer, middle, inner.\nconst R_IN = [24.5, 16.5, 9];\nconst R_OUT = [30.5, 21.5, 13];\n\nfunction hsv(h, s, v, out) {\n  h = h - Math.floor(h);\n  const i = Math.floor(h * 6);\n  const f = h * 6 - i;\n  const p = v * (1 - s);\n  const q = v * (1 - f * s);\n  const t = v * (1 - (1 - f) * s);\n  const k = i % 6;\n  out[0] = (k === 0 || k === 5 ? v : k === 1 ? q : k === 4 ? t : p) * 255;\n  out[1] = (k === 1 || k === 2 ? v : k === 0 ? t : k === 3 ? q : p) * 255;\n  out[2] = (k === 3 || k === 4 ? v : k === 2 ? t : k === 5 ? q : p) * 255;\n}\n\n// k hits over n steps, as evenly as they go. This is the same necklace\n// Bjorklund's algorithm builds, read off with a modulo instead of recursion.\nfunction euclid(p, ring, k, n, rot) {\n  p.n[ring] = n;\n  for (let s = 0; s \u003c n; s++) {\n    const t = (s - rot + n * 4) % n;\n    p.hits[ring * MAX_STEPS + s] = (t * k) % n \u003c k ? 1 : 0;\n  }\n}\n\n// A ripple leaves the outer edge as an arc facing the step that fired; wide 0\n// sends it all the way round.\nfunction spawn(p, ring, strength, angle, wide) {\n  let slot = 0;\n  for (let i = 0; i \u003c RIPPLES; i++) {\n    if (p.rAge[i] >= 1) {\n      slot = i;\n      break;\n    }\n    if (p.rAge[i] > p.rAge[slot]) slot = i;\n  }\n  p.rAge[slot] = 0;\n  p.rRing[slot] = ring;\n  p.rPower[slot] = strength;\n  p.rAngle[slot] = angle;\n  p.rWide[slot] = wide;\n}\n\nexport function setup(params) {\n  const p = params;\n  p.beats = 0;\n  p.rot = 0;\n  p.n = new Int32Array(3);\n  p.hits = new Uint8Array(3 * MAX_STEPS);\n  p.env = new Float32Array(3 * MAX_STEPS);\n  p.last = new Int32Array([-1, -1, -1]);\n  p.down = 0;\n  p.rAge = new Float32Array(RIPPLES).fill(1);\n  p.rRing = new Uint8Array(RIPPLES);\n  p.rPower = new Float32Array(RIPPLES);\n  p.rAngle = new Float32Array(RIPPLES);\n  p.rWide = new Float32Array(RIPPLES);\n  p.dist = new Float32Array(W * H);\n  p.turn = new Float32Array(W * H);\n  for (let y = 0; y \u003c H; y++) {\n    for (let x = 0; x \u003c W; x++) {\n      const dx = x - CX;\n      const dy = y - CY;\n      p.dist[y * W + x] = Math.hypot(dx, dy);\n      // 0 at twelve o'clock, growing clockwise.\n      const a = Math.atan2(dx, -dy) / 6.2832;\n      p.turn[y * W + x] = a \u003c 0 ? a + 1 : a;\n    }\n  }\n  p.col = [\n    [0, 0, 0],\n    [0, 0, 0],\n    [0, 0, 0],\n  ];\n}\n\nexport function update(dt, input, params) {\n  const p = params;\n  const k = input.knobValues || [0, 80, 3, 8];\n  p.hue = k[0];\n  p.bpm = k[1];\n  if (input.btnPressed && input.btnPressed[2]) p.rot++;\n  const pulses = Math.round(k[2]);\n  const steps = Math.max(Math.round(k[3]), pulses + 1);\n  const mid = Math.max(3, Math.round(steps * 0.75));\n  euclid(p, 0, pulses, steps, p.rot % steps);\n  euclid(p, 1, Math.min(mid - 1, Math.round(pulses * 0.5) + 1), mid, 1);\n  euclid(p, 2, 4, 4, 0);\n\n  p.beats += (dt * p.bpm) / 60;\n  const bar = p.beats / 4;\n  p.hand = bar - Math.floor(bar);\n  const fade = Math.exp(-dt * 5.5);\n  for (let i = 0; i \u003c 3 * MAX_STEPS; i++) p.env[i] *= fade;\n  p.down *= Math.exp(-dt * 4);\n  for (let ring = 0; ring \u003c 3; ring++) {\n    const n = p.n[ring];\n    const step = Math.floor(p.hand * n);\n    if (step !== p.last[ring]) {\n      p.last[ring] = step;\n      if (p.hits[ring * MAX_STEPS + step]) {\n        p.env[ring * MAX_STEPS + step] = 1;\n        const angle = (step + 0.5) / n;\n        if (ring === 2 && step === 0) {\n          p.down = 1;\n          spawn(p, 2, 0.8, 0, 0);\n        } else spawn(p, ring, ring === 0 ? 1 : ring === 1 ? 0.85 : 0.6, angle, ring === 2 ? 0.2 : 0.13);\n      }\n    }\n  }\n  for (let i = 0; i \u003c RIPPLES; i++) p.rAge[i] = Math.min(1, p.rAge[i] + dt / 1.4);\n}\n\nexport function draw(display, params, time) {\n  const p = params;\n  hsv(p.hue, 0.9, 1, p.col[0]);\n  hsv(p.hue + 0.12, 0.85, 1, p.col[1]);\n  hsv(p.hue + 0.5, 0.7, 1, p.col[2]);\n  const hand = p.hand;\n  const hx = Math.sin(hand * 6.2832);\n  const hy = -Math.cos(hand * 6.2832);\n  for (let y = 0; y \u003c H; y++) {\n    for (let x = 0; x \u003c W; x++) {\n      const i = y * W + x;\n      const r = p.dist[i];\n      const a = p.turn[i];\n      let R = 0;\n      let G = 0;\n      let B = 0;\n      let ring = -1;\n      for (let j = 0; j \u003c 3; j++) if (r >= R_IN[j] - 0.5 && r \u003c= R_OUT[j] + 0.5) ring = j;\n      if (ring >= 0) {\n        const n = p.n[ring];\n        const pos = a * n;\n        const s = Math.floor(pos);\n        const local = pos - s;\n        const mid = (R_IN[ring] + R_OUT[ring]) / 2;\n        // A gap of about one LED between neighbouring steps.\n        const gap = (0.6 * n) / (6.2832 * r);\n        const edge = Math.min(r - R_IN[ring], R_OUT[ring] - r) + 0.5;\n        if (local > gap && local \u003c 1 - gap) {\n          const hit = p.hits[ring * MAX_STEPS + s];\n          const env = p.env[ring * MAX_STEPS + s];\n          const here = s === Math.floor(hand * n);\n          const soft = Math.max(0, Math.min(1, edge));\n          let v = 0;\n          let white = 0;\n          if (hit) {\n            v = Math.max(0.3 + 0.7 * env, here ? 0.5 : 0) * soft;\n            white = env * env * 0.55;\n          } else if (Math.abs(r - mid) \u003c 1) {\n            // A rest is a thin line, lit up while the hand is on it.\n            v = here ? 0.5 : 0.16;\n          }\n          const c = p.col[ring];\n          R = (c[0] * (1 - white) + 255 * white) * v;\n          G = (c[1] * (1 - white) + 255 * white) * v;\n          B = (c[2] * (1 - white) + 255 * white) * v;\n        }\n      } else if (r \u003c 5) {\n        const v = 0.18 + 0.82 * p.down;\n        R = 255 * v;\n        G = 255 * v;\n        B = 255 * v;\n      } else if (r > R_OUT[0] + 1) {\n        for (let q = 0; q \u003c RIPPLES; q++) {\n          const age = p.rAge[q];\n          if (age >= 1) continue;\n          const front = R_OUT[0] + 1 + age * 62;\n          const d = Math.abs(r - front);\n          if (d > 2.2) continue;\n          let v = p.rPower[q] * (1 - age) * Math.sqrt(1 - age) * (1 - d / 2.2);\n          const wide = p.rWide[q];\n          if (wide > 0) {\n            let da = Math.abs(a - p.rAngle[q]);\n            if (da > 0.5) da = 1 - da;\n            const span = wide * (0.8 + age * 1.4);\n            if (da > span) continue;\n            v *= 1 - (da / span) * (da / span);\n          }\n          const c = p.col[p.rRing[q]];\n          R += c[0] * v;\n          G += c[1] * v;\n          B += c[2] * v;\n        }\n      }\n      // The hand: a thin spoke through the rings.\n      if (r > 5 && r \u003c R_OUT[0] + 0.5) {\n        const dx = x - CX;\n        const dy = y - CY;\n        const along = dx * hx + dy * hy;\n        const v = along > 0 ? 1 - Math.abs(dx * hy - dy * hx) / 0.9 : 0;\n        if (v > 0) {\n          R = Math.max(R, 170 * v);\n          G = Math.max(G, 170 * v);\n          B = Math.max(B, 170 * v);\n        }\n      }\n      display.setPixel(x, y, R, G, B);\n    }\n  }\n}\n","ramp":{"stops":[{"position":0,"color":"#000000","alpha":1},{"position":1,"color":"#ffffff","alpha":1}],"mode":"linear","wrap":false},"recolor":false,"knobsAnnotationRaw":"// @knobs Hue=0..1, Tempo=80..180, Pulses=3..13, Steps=8..16","matrixAnnotationRaw":"// @matrix 128x64"},"matrix":{"width":128,"height":64},"knobs":[{"name":"Hue","min":0,"max":1,"about":"Turns the three rings around the colour wheel together."},{"name":"Tempo","min":80,"max":180,"about":"Beats per minute; the hand goes round once every four beats."},{"name":"Pulses","min":3,"max":13,"about":"Hits on the outer ring; the middle ring takes about half as many."},{"name":"Steps","min":8,"max":16,"about":"Steps on the outer ring; the middle ring has three for every four of them."}],"start":[0,80,3,8],"measures":{"motion":0.5683,"detail":0.026,"edges":0.4934,"complexity":0.3462,"coverage":0.2104,"colour":0.1181,"drift":0.0741},"knobResponse":[0.0389,0.0575,0.0377,0.022]},{"slug":"flock","title":"Flock","family":"particle","note":"","idea":"Ninety birds each follow three rules about their nearest neighbours, and the shape the whole flock makes is one nobody is steering.","buttons":"K1 tap sends the unseen hawk diving into the flock.","code":"// ===== Patternflow pattern =====\n// Title:   Flock\n// Family:  particle\n// Idea:    Ninety birds each follow three rules about their nearest neighbours, and the shape the whole flock makes is one nobody is steering.\n// Author:  patternflow-lab\n// Date:    2026-10-22\n// SPDX-License-Identifier: CC-BY-SA-4.0\n// Lineage: original, pattern study 2026-10\n// ===============================\n// @matrix 128x64\n// @knobs Hue=0..1, Speed=0.5..4, Scatter=-1..1, Trail=0.3..2.5\n//\n// Knob 1: Hue. Turns the flock's colours around the wheel; birds flying up and down sit either side of it.\n// Knob 2: Speed. How fast the birds fly, and so how long their streaks are.\n// Knob 3: Scatter. Below 0 the birds pack into tight schools, above 0 they lose interest in each other and drift apart like gnats.\n// Knob 4: Trail. How long a streak lasts; long trails leave the flock's recent path woven across the panel.\n// Buttons: K1 tap sends the unseen hawk diving into the flock.\n\nconst W = 128;\nconst H = 64;\nconst N = 90;\nconst V0 = 16;\n\nfunction hsvInto(out, h, s, v) {\n  h = h - Math.floor(h);\n  const i = Math.floor(h * 6);\n  const f = h * 6 - i;\n  const p = v * (1 - s);\n  const q = v * (1 - f * s);\n  const t = v * (1 - (1 - f) * s);\n  const k = i % 6;\n  out[0] = (k === 0 ? v : k === 1 ? q : k === 2 ? p : k === 3 ? p : k === 4 ? t : v) * 255;\n  out[1] = (k === 0 ? t : k === 1 ? v : k === 2 ? v : k === 3 ? q : k === 4 ? p : p) * 255;\n  out[2] = (k === 0 ? p : k === 1 ? p : k === 2 ? t : k === 3 ? v : k === 4 ? v : q) * 255;\n}\n\nfunction wrapX(x) {\n  return x \u003c 0 ? x + W : x >= W ? x - W : x;\n}\n\nfunction wrapY(y) {\n  return y \u003c 0 ? y + H : y >= H ? y - H : y;\n}\n\n// A soft round dot, brightest at its centre and wrapped round the edges,\n// kept as the brighter of what is there and what it brings.\nfunction splat(buf, x, y, c) {\n  const x0 = Math.ceil(x - 1.2);\n  const y0 = Math.ceil(y - 1.2);\n  for (let yy = y0; yy \u003c= y0 + 2; yy++) {\n    const dy = yy - y;\n    for (let xx = x0; xx \u003c= x0 + 2; xx++) {\n      const dx = xx - x;\n      const w = 1 - (dx * dx + dy * dy) / 1.44;\n      if (w \u003c= 0) continue;\n      const i = (((yy + H) % H) * W + ((xx + W) % W)) * 3;\n      const r = c[0] * w;\n      const g = c[1] * w;\n      const b = c[2] * w;\n      if (r > buf[i]) buf[i] = r;\n      if (g > buf[i + 1]) buf[i + 1] = g;\n      if (b > buf[i + 2]) buf[i + 2] = b;\n    }\n  }\n}\n\nexport function setup(params) {\n  params.x = new Float32Array(N);\n  params.y = new Float32Array(N);\n  params.vx = new Float32Array(N);\n  params.vy = new Float32Array(N);\n  params.lx = new Float32Array(N);\n  params.ly = new Float32Array(N);\n  params.wander = new Float32Array(N);\n  params.pace = new Float32Array(N);\n  params.tone = new Float32Array(N);\n  for (let i = 0; i \u003c N; i++) {\n    // Three loose groups heading different ways, so the first seconds already show them meeting.\n    const g = i % 3;\n    const a = g * 2.1 + (Math.random() - 0.5) * 0.8;\n    params.x[i] = (g * 43 + 20 + Math.random() * 24) % W;\n    params.y[i] = 10 + g * 18 + Math.random() * 14;\n    params.vx[i] = Math.cos(a) * V0;\n    params.vy[i] = Math.sin(a) * V0;\n    params.lx[i] = params.x[i];\n    params.ly[i] = params.y[i];\n    params.pace[i] = 0.85 + Math.random() * 0.3;\n    params.tone[i] = Math.random() - 0.5;\n  }\n  params.hx = 64;\n  params.hy = -20;\n  params.hvx = 0;\n  params.hvy = V0;\n  params.prey = 0;\n  params.preyTime = 0;\n  params.buf = new Float32Array(W * H * 3);\n  params.col = new Float32Array(3);\n  params.hue = 0;\n}\n\nfunction step(params, dt, u) {\n  const { x, y, vx, vy, wander, pace } = params;\n  const R = 13 - 6 * u;\n  const R2 = R * R;\n  const S = 3.5 + 3.5 * u;\n  const S2 = S * S;\n  const kA = 2.6 - 2.3 * u;\n  const kC = 1.1 - 1.1 * u;\n  const kS = 26 + 110 * u;\n  const kW = 0.5 + 3.5 * u;\n\n  // The hawk chases one bird for a few seconds, then picks another.\n  params.preyTime -= dt;\n  if (params.preyTime \u003c= 0) {\n    params.prey = Math.floor(Math.random() * N);\n    params.preyTime = 3 + Math.random() * 4;\n  }\n  let tx = x[params.prey] - params.hx;\n  let ty = y[params.prey] - params.hy;\n  if (tx > W / 2) tx -= W;\n  if (tx \u003c -W / 2) tx += W;\n  if (ty > H / 2) ty -= H;\n  if (ty \u003c -H / 2) ty += H;\n  const td = Math.hypot(tx, ty) + 0.001;\n  params.hvx += ((tx / td) * V0 * 1.15 - params.hvx) * Math.min(1, dt * 1.5);\n  params.hvy += ((ty / td) * V0 * 1.15 - params.hvy) * Math.min(1, dt * 1.5);\n  params.hx = wrapX(params.hx + params.hvx * dt);\n  params.hy = wrapY(params.hy + params.hvy * dt);\n  const hx = params.hx;\n  const hy = params.hy;\n\n  for (let i = 0; i \u003c N; i++) {\n    const xi = x[i];\n    const yi = y[i];\n    let n = 0;\n    let cx = 0;\n    let cy = 0;\n    let ax = 0;\n    let ay = 0;\n    let sx = 0;\n    let sy = 0;\n    for (let j = 0; j \u003c N; j++) {\n      if (j === i) continue;\n      let dx = x[j] - xi;\n      let dy = y[j] - yi;\n      if (dx > W / 2) dx -= W;\n      else if (dx \u003c -W / 2) dx += W;\n      if (dy > H / 2) dy -= H;\n      else if (dy \u003c -H / 2) dy += H;\n      const d2 = dx * dx + dy * dy;\n      if (d2 > R2) continue;\n      n++;\n      cx += dx;\n      cy += dy;\n      ax += vx[j];\n      ay += vy[j];\n      if (d2 \u003c S2) {\n        sx -= dx / (d2 + 0.4);\n        sy -= dy / (d2 + 0.4);\n      }\n    }\n    let fx = sx * kS;\n    let fy = sy * kS;\n    if (n > 0) {\n      fx += (ax / n - vx[i]) * kA + (cx / n) * kC;\n      fy += (ay / n - vy[i]) * kA + (cy / n) * kC;\n    }\n    let ex = xi - hx;\n    let ey = yi - hy;\n    if (ex > W / 2) ex -= W;\n    else if (ex \u003c -W / 2) ex += W;\n    if (ey > H / 2) ey -= H;\n    else if (ey \u003c -H / 2) ey += H;\n    const ed = Math.hypot(ex, ey) + 0.001;\n    if (ed \u003c 15) {\n      const push = (1 - ed / 15) * 90;\n      fx += (ex / ed) * push;\n      fy += (ey / ed) * push;\n    }\n    // Each bird's own wavering: a slow random turn left or right.\n    wander[i] = wander[i] * Math.exp(-dt * 1.5) + (Math.random() - 0.5) * Math.sqrt(dt) * 2.4;\n    const sp = Math.hypot(vx[i], vy[i]) + 0.001;\n    fx += (-vy[i] / sp) * wander[i] * V0 * kW;\n    fy += (vx[i] / sp) * wander[i] * V0 * kW;\n\n    let nvx = vx[i] + fx * dt;\n    let nvy = vy[i] + fy * dt;\n    const ns = Math.hypot(nvx, nvy) + 0.001;\n    const target = V0 * pace[i];\n    const s = ns + (target - ns) * Math.min(1, dt * 2.5);\n    nvx = (nvx / ns) * s;\n    nvy = (nvy / ns) * s;\n    vx[i] = nvx;\n    vy[i] = nvy;\n  }\n  for (let i = 0; i \u003c N; i++) {\n    x[i] = wrapX(x[i] + vx[i] * dt);\n    y[i] = wrapY(y[i] + vy[i] * dt);\n  }\n}\n\nexport function update(dt, input, params) {\n  const k = input.knobValues || [0, 2, 0, 0.3];\n  params.hue = k[0];\n  const speed = k[1];\n  const u = (Math.max(-1, Math.min(1, k[2])) + 1) / 2;\n  // Slow birds keep a longer streak, so they still read as flying.\n  const trail = Math.max(0.05, k[3]) * Math.sqrt(2 / Math.max(0.1, speed));\n  dt = Math.min(dt, 0.1);\n\n  if (input.btnPressed && input.btnPressed[0]) {\n    // Drop the hawk just behind a bird, already flying at it.\n    const b = Math.floor(Math.random() * N);\n    params.prey = b;\n    params.preyTime = 4;\n    params.hx = wrapX(params.x[b] - params.vx[b] * 0.5);\n    params.hy = wrapY(params.y[b] - params.vy[b] * 0.5);\n    params.hvx = params.vx[b] * 1.6;\n    params.hvy = params.vy[b] * 1.6;\n  }\n\n  // Speed is the simulation's own clock, so the flock keeps its shape and only hurries.\n  const simDt = dt * speed;\n  const steps = Math.max(1, Math.ceil(simDt / 0.035));\n  for (let i = 0; i \u003c N; i++) {\n    params.lx[i] = params.x[i];\n    params.ly[i] = params.y[i];\n  }\n  for (let s = 0; s \u003c steps; s++) step(params, simDt / steps, u);\n\n  const buf = params.buf;\n  // Mostly a slow exponential fade, with a little taken off as well so old paths reach black.\n  const fade = Math.exp(-dt / trail);\n  const off = dt * 12;\n  for (let i = 0; i \u003c buf.length; i++) {\n    const v = buf[i] * fade - off;\n    buf[i] = v > 0 ? v : 0;\n  }\n\n  const col = params.col;\n  for (let i = 0; i \u003c N; i++) {\n    const vx = params.vx[i];\n    const vy = params.vy[i];\n    const sp = Math.hypot(vx, vy) + 0.001;\n    // Birds climbing and birds diving lean to either side of the chosen hue.\n    hsvInto(col, params.hue + (vy / sp) * 0.09 + params.tone[i] * 0.04, 0.88, 0.82);\n    const x0 = params.lx[i];\n    const y0 = params.ly[i];\n    const x1 = params.x[i];\n    const y1 = params.y[i];\n    const dx = x1 - x0;\n    const dy = y1 - y0;\n    if (Math.abs(dx) > W / 2 || Math.abs(dy) > H / 2) {\n      splat(buf, x1, y1, col);\n      continue;\n    }\n    const n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 0.5));\n    for (let s = 1; s \u003c= n; s++) splat(buf, x0 + (dx * s) / n, y0 + (dy * s) / n, col);\n  }\n}\n\nexport function draw(display, params, time) {\n  const buf = params.buf;\n  for (let y = 0; y \u003c H; y++) {\n    for (let x = 0; x \u003c W; x++) {\n      const i = (y * W + x) * 3;\n      display.setPixel(x, y, buf[i], buf[i + 1], buf[i + 2]);\n    }\n  }\n  // Heads: a paler, brighter LED where each bird is now.\n  const col = params.col;\n  for (let i = 0; i \u003c N; i++) {\n    const vy = params.vy[i];\n    co
