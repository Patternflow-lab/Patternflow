<polyline points="710,440 780,428" fill="none" stroke="#2e7d32" stroke-width="1.6"/>
<text x="22" y="400" font-size="11" fill="#1565c0">Pi ⇄ card: gigabit Ethernet, a 50 cm patch. The card will not link at 100 Mbit.</text>
<text x="22" y="420" font-size="11" fill="#333">Each supply's earth goes to its FG terminal. No panel current reaches the Pi's supply.</text>
<text x="22" y="440" font-size="11" fill="#333">Grounds meet through the ribbons; each panel returns its current on its own lead.</text>
