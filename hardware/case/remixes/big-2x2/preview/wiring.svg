<text x="20" y="320" font-size="11" fill="#1565c0">J1 → P0 IN, P0 OUT → P1 IN, P1 OUT → P2 IN, P2 OUT → P3 IN.</text>
<text x="20" y="338" font-size="11" fill="#1565c0">Four 16-way ribbons, 30 cm. Grounds meet at the bus.</text>
<text x="20" y="380" font-size="11" fill="#333">Earth from the inlet goes to the supply's FG terminal.</text>
<text x="20" y="398" font-size="11" fill="#333">No panel current goes through the board.</text>
